#f { position: relative; overflow: hidden; background: #0D0F0E; font-family: D; color: #F2F0EA; }

<script>

} else if (K === 'c') {

            '45': { sp: 740, pl: -70, pt: 170, ps: .92, x: 410, ti: 215, pz: 262, ib: 790, cta: 1176 },

  h = '<div class="pl-top" style="height:' + C.sp + 'px"></div>' +
