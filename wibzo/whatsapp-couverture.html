<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Couverture WhatsApp Wibzo</title>
<style>
@font-face { font-family: B; src: url(reels-organiques/fonts/bricolage-800-latin.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: D; src: url(reels-organiques/fonts/dmsans-latin.woff2) format("woff2"); font-weight: 100 1000; }
/* Couverture WhatsApp Business (16:9). Le texte reste au centre-haut : la photo de profil recouvre le bas au centre. */
body { margin: 0; }
#f { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0D0F0E; color: #F2F0EA; font-family: D; }
#f:before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size: 90px 90px; }
.glow { position: absolute; left: 50%; top: 40%; width: 1500px; height: 1000px; margin: -500px 0 0 -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(198,255,61,.16), transparent); }
.t { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 800 104px/1 B; letter-spacing: -.04em; }
.t span { color: #C6FF3D; }
.s { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font: 600 38px/1.3 D; color: #c9ccc5; }
</style></head>
<body><div id="f"><div class="glow"></div>
<div class="t">Maquette <span>gratuite</span> en 24 h</div>
<div class="s">Vous voyez votre site avant de payer · Suisse romande</div>
</div></body></html>
