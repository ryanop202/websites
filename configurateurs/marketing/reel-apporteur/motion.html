<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Reel apporteur</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=block" rel="stylesheet">
<style>
:root{--nuit:#0D0F0E;--plan:#E4E8E2;--encre:#0D0F0E;--cote:#2F55D4;--lime:#C6FF3D;--billet:#1D5A39;--blanc:#F2F0EA;--gris:#8A8F8B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--nuit);font-family:Archivo,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
.abs{position:absolute}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln>span{display:inline-block;will-change:transform}
.h{font-weight:850;letter-spacing:-.02em;line-height:.98}
svg{overflow:visible}
#s3{z-index:6}#ph{z-index:5}#nuit2{z-index:8}#s5,#s6{z-index:9}#grain{z-index:10}
</style></head>
<body><div id="stage">
  <div id="paper" class="layer" style="background:var(--plan)">
    <svg class="layer" width="1080" height="1920"><defs><pattern id="g" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="rgba(13,15,14,.07)" stroke-width="2"/></pattern></defs><rect width="1080" height="1920" fill="url(#g)"/></svg>
  </div>

  <!-- S1 : 250 -->
  <div id="s1" class="layer">
    <svg class="abs" style="left:0;top:0" width="1080" height="1920">
      <g id="cote1" stroke="var(--lime)" stroke-width="5" fill="none">
        <line id="c1l" x1="540" y1="590" x2="540" y2="590"/>
        <line id="c1a" x1="0" y1="560" x2="0" y2="620"/>
        <line id="c1b" x1="0" y1="560" x2="0" y2="620"/>
      </g>
    </svg>
    <div id="n250" class="abs h" style="left:0;right:0;top:640px;text-align:center;font-size:420px;color:var(--blanc);font-weight:900;letter-spacing:-.04em">250</div>
    <div id="chf" class="abs h" style="right:120px;top:1060px;font-size:130px;color:var(--lime);font-weight:900;font-stretch:125%">CHF</div>
  </div>

  <!-- S2 : mise en contact -->
  <div id="s2" class="layer">
    <div class="abs h" style="left:72px;top:520px;font-size:124px;font-stretch:75%;color:var(--encre)">
      <span class="ln"><span id="s2a">Juste pour une</span></span>
      <span class="ln"><span id="s2b">mise en contact.</span></span>
    </div>
    <svg class="abs" style="left:0;top:1020px" width="1080" height="320">
      <line id="s2line" x1="196" y1="120" x2="884" y2="120" stroke="var(--cote)" stroke-width="6" stroke-dasharray="688" stroke-dashoffset="688"/>
      <circle id="s2dot" cx="196" cy="120" r="16" fill="var(--cote)"/>
      <g id="s2pa"><circle cx="150" cy="120" r="50" fill="var(--encre)"/><circle cx="150" cy="104" r="14" fill="var(--blanc)"/><path d="M124 146c4-18 14-24 26-24s22 6 26 24" fill="var(--blanc)"/>
        <text x="150" y="232" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="42" fill="var(--encre)">Toi</text></g>
      <g id="s2pb"><circle cx="930" cy="120" r="50" fill="var(--encre)"/><circle cx="930" cy="104" r="14" fill="var(--blanc)"/><path d="M904 146c4-18 14-24 26-24s22 6 26 24" fill="var(--blanc)"/>
        <text x="930" y="232" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="42" fill="var(--encre)">Ton contact</text></g>
    </svg>
  </div>

  <!-- S3 / S4 : téléphone -->
  <div id="s3" class="layer">
    <div class="abs h" style="left:72px;top:150px;font-size:104px;font-stretch:75%;color:var(--encre)">
      <span class="ln"><span id="s3a">Tu connais quelqu’un</span></span>
      <span class="ln"><span id="s3b">qui aurait besoin</span></span>
      <span class="ln"><span id="s3c">de ça ?</span></span>
    </div>
    <svg id="leaders" class="abs" style="left:0;top:0" width="1080" height="1920" fill="none" stroke="var(--cote)" stroke-width="4"></svg>
    <div id="labs"></div>
  </div>

  <div id="ph" class="abs" style="left:500px;top:560px;width:532px;height:921px;border-radius:66px;background:#050606;padding:16px;box-shadow:0 60px 120px rgba(13,15,14,.35),0 0 0 3px #2a2e2b inset">
    <div style="position:relative;width:500px;height:889px;border-radius:52px;overflow:hidden;background:#ddd">
      <img id="scr" style="position:absolute;left:0;top:0;width:500px;height:889px">
    </div>
  </div>

  <div id="s4" class="layer">
    <svg class="abs" style="left:0;top:0" width="1080" height="1920">
      <line id="rail" x1="110" y1="690" x2="110" y2="690" stroke="var(--encre)" stroke-width="5"/>
      <path id="sig" d="M180 1085c20-40 38-62 50-44s-30 70-14 66 38-62 52-60-12 48 4 46 30-40 44-38 0 30 14 30 26-22 40-24 10 20 24 18 40-14 70-16" fill="none" stroke="var(--cote)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div id="steps"></div>
  </div>

  <!-- S5 : billet -->
  <div id="nuit2" class="layer" style="background:var(--nuit)"></div>
  <div id="s5" class="layer" style="perspective:1800px">
    <div id="note" class="abs" style="left:100px;top:560px;width:880px;height:470px;border-radius:26px;background:var(--billet);overflow:hidden;box-shadow:0 50px 110px rgba(0,0,0,.6)">
      <svg id="guil" class="abs" style="left:0;top:0" width="880" height="470"></svg>
      <div class="abs" style="left:48px;top:40px;font:600 34px Archivo;color:var(--blanc);opacity:.85">Wibzo</div>
      <div class="abs" style="left:48px;top:84px;font:500 28px Archivo;color:var(--blanc);opacity:.6">Commission apporteur</div>
      <div class="abs h" style="right:44px;bottom:10px;font-size:250px;font-weight:900;font-stretch:125%;color:var(--lime);letter-spacing:-.05em">250</div>
      <div class="abs h" style="left:48px;top:150px;font-size:64px;font-weight:900;font-stretch:125%;color:var(--blanc)">CHF</div>
      <div id="shine" class="abs" style="top:-200px;width:180px;height:900px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(20deg)"></div>
    </div>
    <div id="plus" class="abs h" style="left:100px;top:1130px;font-size:170px;font-weight:900;font-stretch:110%;color:var(--blanc)"></div>
    <div id="pt" class="abs" style="left:104px;top:1330px;font:600 54px Archivo;font-stretch:85%;color:var(--gris)">à chaque client qui signe.</div>
  </div>

  <!-- S6 : DM -->
  <div id="s6" class="layer">
    <div class="abs h" style="left:72px;top:360px;font-size:118px;font-stretch:80%;color:var(--blanc)">
      <span class="ln"><span id="s6a">Écris PARTENAIRE</span></span>
      <span class="ln"><span id="s6b">en message.</span></span>
    </div>
    <div id="bub" class="abs" style="right:72px;top:820px;padding:30px 46px;border-radius:46px 46px 12px 46px;background:var(--lime);font:800 56px Archivo;color:var(--nuit)">PARTENAIRE</div>
    <div id="dm" class="abs" style="left:72px;top:1000px;width:936px;height:140px;border-radius:70px;background:#1A1D1B;border:2px solid #2C302D">
      <div id="dmt" class="abs" style="left:56px;top:38px;font:600 56px Archivo;color:var(--blanc);white-space:nowrap"></div>
      <div id="send" class="abs" style="right:20px;top:18px;width:100px;height:100px;border-radius:50%;background:var(--lime);display:grid;place-items:center">
        <svg width="46" height="46" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5z" fill="var(--nuit)"/></svg>
      </div>
    </div>
    <div id="logo" class="abs" style="left:72px;top:1560px;display:flex;align-items:center;gap:30px">
      <svg width="130" height="130" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="var(--blanc)"/><text x="27" y="44" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#0D0F0E">W</text><circle cx="50" cy="40" r="5" fill="var(--lime)"/></svg>
      <div><div style="font:800 70px Archivo;color:var(--blanc);letter-spacing:-.02em">wibzo.ch</div><div style="font:500 38px Archivo;color:var(--gris)">Configurateurs 3D sur mesure</div></div>
    </div>
  </div>

  <svg id="grain" class="layer" style="pointer-events:none;opacity:.07;mix-blend-mode:overlay" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
</div>

<script>
const $ = (s) => document.getElementById(s);
const cl = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const oExpo = (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
const oCubic = (x) => 1 - Math.pow(1 - x, 3);
const ioCubic = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const iCubic = (x) => x * x * x;
const oBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const show = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
const rise = (el, t, t0, d = .55) => { const e = oExpo(p(t, t0, t0 + d)); el.style.transform = `translateY(${(1 - e) * 110}%)`; };

// ----- Annotations (S3) -----
const LABS = [
  { txt: 'Il règle les dimensions', y: 860, px: 640, py: 930, t: 3.75 },
  { txt: 'Il choisit les coloris', y: 1120, px: 650, py: 1270, t: 4.15 },
  { txt: 'Le prix suit en direct', y: 1370, px: 720, py: 1365, t: 4.55 },
];
const labsEl = $('labs'), lead = $('leaders');
LABS.forEach((l, i) => {
  const d = document.createElement('div');
  d.className = 'abs'; d.style.cssText = `left:72px;top:${l.y}px;width:360px;font:750 46px Archivo;font-stretch:80%;line-height:1.05;color:var(--encre)`;
  d.textContent = l.txt; labsEl.append(d); l.el = d;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const x0 = 400, y0 = l.y + 30;
  path.setAttribute('d', `M${x0} ${y0} H${x0 + 40} L${l.px} ${l.py}`);
  lead.append(path); l.path = path;
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', l.px); dot.setAttribute('cy', l.py); dot.setAttribute('r', 12); dot.setAttribute('fill', 'var(--cote)');
  lead.append(dot); l.dot = dot;
});
LABS.forEach((l) => { const L = l.path.getTotalLength(); l.len = L; l.path.style.strokeDasharray = L; });

// ----- Étapes (S4) -----
const STEPS = [
  { n: '1', txt: 'Tu le présentes', y: 640, t: 6.34 },
  { n: '2', txt: 'Il signe', y: 930, t: 7.05 },
  { n: '3', txt: 'Tu touches 250 CHF', y: 1220, t: 8.0 },
];
const stepsEl = $('steps');
STEPS.forEach((s) => {
  const d = document.createElement('div');
  d.className = 'abs'; d.style.cssText = `left:72px;top:${s.y}px;display:flex;gap:28px;align-items:flex-start;width:420px`;
  d.innerHTML = `<div style="flex:none;width:76px;height:76px;border-radius:50%;background:var(--encre);color:var(--blanc);display:grid;place-items:center;font:800 40px Archivo">${s.n}</div><div style="font:850 60px Archivo;font-stretch:75%;line-height:1;letter-spacing:-.01em;color:var(--encre);padding-top:8px">${s.txt}</div>`;
  stepsEl.append(d); s.el = d;
});
const sig = $('sig'); const sigL = sig.getTotalLength(); sig.style.strokeDasharray = sigL;

// ----- Guilloche du billet -----
(() => {
  const g = $('guil'); let h = '';
  for (let k = 0; k < 22; k++) {
    let d = '';
    for (let x = 0; x <= 880; x += 8) {
      const y = 235 + Math.sin(x / 70 + k * .45) * (60 + k * 7) * Math.cos(x / 210 - k * .2);
      d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1);
    }
    h += `<path d="${d}" fill="none" stroke="#C6FF3D" stroke-opacity="${.10 + (k % 4) * .04}" stroke-width="1.6"/>`;
  }
  for (let r = 40; r < 420; r += 18) h += `<circle cx="640" cy="235" r="${r}" fill="none" stroke="#F2F0EA" stroke-opacity=".06" stroke-width="1.4"/>`;
  g.innerHTML = h;
})();

// ----- Séquence vidéo dans le téléphone -----
const SEQ = (t) => {
  if (t < 4.75) return ['veranda', Math.floor((t - 2.9) * 30), 209];
  if (t < 6.25) return ['piscine', Math.floor((t - 4.75) * 30), 179];
  return ['pergola', Math.floor((t - 6.25) * 30), 179];
};
const pad = (n) => String(n).padStart(5, '0');

window.render = async (t) => {
  // fonds
  const wipe = ioCubic(p(t, 1.22, 1.55));
  $('paper').style.clipPath = `inset(${(1 - wipe) * 100}% 0 0 0)`;
  const w2 = ioCubic(p(t, 8.3, 8.62));
  $('nuit2').style.clipPath = `inset(0 0 ${(1 - w2) * 100}% 0)`;

  // S1
  const s1 = $('s1'); show(s1, t < 1.6 ? 1 : 0);
  const slam = oExpo(p(t, 0.04, 0.5));
  const n = $('n250');
  n.style.fontStretch = lerp(62, 125, slam) + '%';
  n.style.transform = `translateY(${(1 - slam) * 60 - wipe * 260}px) scale(${lerp(1.5, 1, slam)})`;
  n.style.filter = `blur(${(1 - slam) * 14}px)`;
  n.textContent = String(Math.round(250 * oCubic(p(t, 0.04, 0.6))));
  const cx = oExpo(p(t, 0.18, 0.6)) * 420;
  $('c1l').setAttribute('x1', 540 - cx); $('c1l').setAttribute('x2', 540 + cx);
  ['c1a', 'c1b'].forEach((id, i) => { const x = 540 + (i ? cx : -cx); $(id).setAttribute('x1', x); $(id).setAttribute('x2', x); });
  $('cote1').style.transform = `translateY(${-wipe * 260}px)`;
  const ce = oExpo(p(t, 0.42, 0.85));
  $('chf').style.transform = `translateX(${(1 - ce) * 500}px) translateY(${-wipe * 260}px)`;
  const shake = t > .2 && t < .42 ? Math.sin(t * 190) * 9 * (1 - p(t, .2, .42)) : 0;
  $('stage').style.transform = `translate(${shake}px, ${shake * .6}px)`;

  // S2
  const s2 = $('s2'); const s2out = ioCubic(p(t, 2.85, 3.05));
  show(s2, t > 1.3 && t < 3.1 ? 1 - s2out : 0);
  s2.style.transform = `translateY(${-s2out * 120}px)`;
  rise($('s2a'), t, 1.42); rise($('s2b'), t, 1.52);
  const pa = oBack(p(t, 1.75, 2.1)), pb = oBack(p(t, 1.95, 2.3));
  $('s2pa').style.transform = `translate(150px,120px) scale(${pa}) translate(-150px,-120px)`;
  $('s2pb').style.transform = `translate(930px,120px) scale(${pb}) translate(-930px,-120px)`;
  const ln = ioCubic(p(t, 2.05, 2.6));
  $('s2line').style.strokeDashoffset = 688 * (1 - ln);
  $('s2dot').setAttribute('cx', 196 + 688 * ln); show($('s2dot'), ln > 0 && ln < 1 ? 1 : 0);

  // S3
  const s3 = $('s3'); const s3out = ioCubic(p(t, 6.0, 6.25));
  show(s3, t > 2.9 && t < 6.3 ? 1 - s3out : 0);
  s3.style.transform = `translateX(${-s3out * 140}px)`;
  rise($('s3a'), t, 3.04); rise($('s3b'), t, 3.12); rise($('s3c'), t, 3.2);
  LABS.forEach((l) => {
    const e = oExpo(p(t, l.t, l.t + .5));
    l.el.style.opacity = e; l.el.style.transform = `translateX(${(1 - e) * -40}px)`;
    l.path.style.strokeDashoffset = l.len * (1 - ioCubic(p(t, l.t + .05, l.t + .45)));
    const de = oBack(p(t, l.t + .35, l.t + .6));
    l.dot.setAttribute('r', 12 * de + Math.max(0, Math.sin((t - l.t) * 8)) * 3 * de);
  });

  // Téléphone
  const ph = $('ph');
  const pin = oExpo(p(t, 2.95, 3.7));
  const pout = ioCubic(p(t, 8.25, 8.6));
  const float = Math.sin(t * 2.2) * 8;
  const rot = lerp(9, 0, pin);
  ph.style.transform = `translateY(${(1 - pin) * 1500 + float + pout * 1300}px) rotate(${rot}deg)`;
  show(ph, t > 2.9 && t < 8.65 ? 1 : 0);
  if (t > 2.9 && t < 8.65) {
    const [prod, i, max] = SEQ(t);
    const src = `${prod}/${pad(Math.max(0, Math.min(max, i)))}.jpg`;
    const img = $('scr');
    let dx = 0, blur = 0;
    for (const T of [4.75, 6.25]) {
      if (Math.abs(t - T) < .13) {
        const k = (t - (T - .13)) / .13;
        dx = t < T ? -iCubic(k) * 520 : (1 - oCubic(k - 1)) * 520;
        blur = 14 * (1 - Math.abs(t - T) / .13);
      }
    }
    img.style.transform = `translateX(${dx}px)`; img.style.filter = `blur(${blur}px)`;
    if (img.getAttribute('src') !== src) { img.src = src; await img.decode().catch(() => {}); }
  }

  // S4
  const s4 = $('s4'); const s4out = ioCubic(p(t, 8.25, 8.5));
  show(s4, t > 6.2 && t < 8.55 ? 1 - s4out : 0);
  const railTo = t < 7.05 ? lerp(690, 690, 0) : 0;
  let ry = 690;
  if (t > 6.6) ry = lerp(690, 980, ioCubic(p(t, 6.6, 7.05)));
  if (t > 7.6) ry = lerp(980, 1270, ioCubic(p(t, 7.6, 8.0)));
  $('rail').setAttribute('y2', ry); show($('rail'), t > 6.6 ? 1 : 0);
  STEPS.forEach((s) => {
    const e = oExpo(p(t, s.t, s.t + .5));
    s.el.style.opacity = e; s.el.style.transform = `translateY(${(1 - e) * 50}px)`;
  });
  sig.style.strokeDashoffset = sigL * (1 - ioCubic(p(t, 7.2, 7.8)));

  // S5
  const s5 = $('s5'); const s5out = ioCubic(p(t, 9.95, 10.2));
  show(s5, t > 8.3 && t < 10.25 ? 1 : 0);
  const ne = oBack(p(t, 8.45, 9.15));
  const note = $('note');
  note.style.transform = `translateY(${(1 - p(t, 8.45, 8.9)) * 300 - s5out * 1400 + Math.sin(t * 2.4) * 10}px) rotateY(${lerp(-100, -6, ne)}deg) rotateX(${lerp(30, 8, ne) + Math.sin(t * 1.8) * 2}deg) rotateZ(${lerp(-12, -3, ne)}deg)`;
  note.style.opacity = p(t, 8.45, 8.6);
  $('shine').style.left = lerp(-300, 1100, ioCubic(p(t, 9.1, 9.7))) + 'px';
  const ce2 = oCubic(p(t, 8.95, 9.6));
  const plus = $('plus');
  plus.textContent = '+' + Math.round(250 * ce2) + ' CHF';
  const pe = oExpo(p(t, 8.9, 9.3));
  plus.style.opacity = pe * (1 - s5out); plus.style.transform = `translateY(${(1 - pe) * 60}px)`;
  const te = oExpo(p(t, 9.25, 9.7));
  $('pt').style.opacity = te * (1 - s5out); $('pt').style.transform = `translateY(${(1 - te) * 40}px)`;

  // S6
  const s6 = $('s6'); show(s6, t > 10.1 ? 1 : 0);
  rise($('s6a'), t, 10.18); rise($('s6b'), t, 10.28);
  const word = 'PARTENAIRE';
  const typed = Math.floor(p(t, 10.55, 11.3) * word.length);
  const sent = t > 11.55;
  const blink = Math.floor(t * 2.4) % 2 === 0;
  const dmt = $('dmt');
  if (!sent && typed === 0) dmt.innerHTML = `<span style="color:var(--gris)">Message…</span>`;
  else dmt.innerHTML = sent ? `<span style="color:var(--gris)">Message…</span>` : word.slice(0, typed) + `<span style="color:var(--lime);opacity:${blink ? 1 : 0}">|</span>`;
  const de = oExpo(p(t, 10.3, 10.8));
  $('dm').style.opacity = de; $('dm').style.transform = `translateY(${(1 - de) * 80}px)`;
  const press = t > 11.42 && t < 11.62 ? 1 - Math.sin(p(t, 11.42, 11.62) * Math.PI) * .14 : 1;
  $('send').style.transform = `scale(${press})`;
  const be = oBack(p(t, 11.55, 11.95));
  const bub = $('bub');
  bub.style.opacity = p(t, 11.55, 11.65);
  bub.style.transform = `translateY(${(1 - be) * 180}px) scale(${lerp(.6, 1, be)})`;
  bub.style.transformOrigin = '100% 100%';
  const le = oExpo(p(t, 12.0, 12.6));
  $('logo').style.opacity = le; $('logo').style.transform = `translateY(${(1 - le) * 60}px)`;
};
window.ready = document.fonts.ready.then(() => window.render(0));
</script>
</body></html>
