<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Calculateur de prix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Wibzo — calculateur de devis par étapes (20.11.2026)
   Direction : celle des démos Wibzo (papier, encre, cotes bleues « plan technique »),
   structure : celle des calculateurs de prix en ligne (hero + carte d'étapes + tarifs + zones + FAQ). */


:root {
  --papier: #F3EFE6;
  --papier-2: #EAE4D6;
  --carte: #FBF9F4;
  --encre: #1F1D1A;
  --encre-2: #5F594F;
  --trait: #D3CAB8;
  --plan: #2B4C7E;
  --plan-clair: #E2E8F1;
  --ok: #2F6B4F;
  --rayon: 4px;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--papier); color: var(--encre); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
a { color: var(--plan); }
:focus-visible { outline: 2px solid var(--plan); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }

/* ---------- En-tête ---------- */
.entete { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--papier) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--trait); }
.entete .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; }
.marque { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--encre); min-width: 0; }
.marque-logo { display: grid; place-items: center; width: 36px; height: 36px; flex: none; background: var(--encre); color: var(--papier); border-radius: var(--rayon); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
.marque-nom { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; overflow-wrap: anywhere; }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.nav a { color: var(--encre); text-decoration: none; }
.nav a:hover { color: var(--plan); }
.outils { display: flex; gap: 6px; align-items: center; }
.outils select, .outils button { font-size: 12px; background: transparent; border: 1px solid var(--trait); border-radius: var(--rayon); padding: 4px 8px; cursor: pointer; text-transform: none; letter-spacing: 0; }
.badge-demo { font-family: var(--mono); font-size: 11px; color: var(--plan); background: var(--plan-clair); border-radius: var(--rayon); padding: 3px 8px; white-space: nowrap; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--trait);
  background-color: var(--papier-2);
  background-image: linear-gradient(var(--trait) 1px, transparent 1px), linear-gradient(90deg, var(--trait) 1px, transparent 1px);
  background-size: 32px 32px; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--papier) 70%, transparent), color-mix(in srgb, var(--papier-2) 30%, transparent) 70%); pointer-events: none; }
.hero-plan { position: absolute; inset: 0; display: grid; place-items: center; opacity: .55; pointer-events: none; }
.hero-plan svg { width: min(1200px, 140%); height: auto; color: var(--plan); margin-top: 56px; }
.hero .wrap { position: relative; z-index: 1; padding-top: clamp(36px, 7vw, 72px); padding-bottom: 150px; text-align: center; display: grid; gap: 14px; justify-items: center; }
.sur-titre { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--plan); }
.hero h1 { font-size: clamp(28px, 5.2vw, 52px); line-height: 1.06; max-width: 20ch; }
.hero h1 .ville { display: inline-block; color: var(--plan); transition: opacity .35s, transform .35s; }
.hero h1 .ville.sort { opacity: 0; transform: translateY(8px); }
.hero p { margin: 0; color: var(--encre-2); max-width: 56ch; }

/* ---------- Carte d'étapes ---------- */
.estimateur { position: relative; z-index: 2; margin-top: -120px; scroll-margin-top: 80px; }
.carte { max-width: 860px; margin: 0 auto; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; box-shadow: 0 1px 0 rgba(31,29,26,.04), 0 24px 48px -28px rgba(31,29,26,.35); padding: clamp(18px, 3.5vw, 32px); display: grid; gap: 20px; }
.etape-info { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--encre-2); }
.etape-info .mono { font-size: 12px; }
.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segments i { height: 4px; border-radius: 2px; background: var(--trait); transition: background .25s; }
.segments i.fait { background: var(--plan); }
.segments i.ici { background: color-mix(in srgb, var(--plan) 45%, var(--trait)); }
.question { font-size: clamp(20px, 3.2vw, 26px); line-height: 1.2; }
.aide { margin: -12px 0 0; color: var(--encre-2); font-size: 14px; }
.choix { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.choix.serre { grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }
.option { position: relative; display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden; background: #fff; border: 1.5px solid var(--trait); border-radius: 8px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
.option:hover { border-color: color-mix(in srgb, var(--plan) 60%, var(--trait)); transform: translateY(-1px); }
.option[aria-checked="true"], .option[aria-pressed="true"] { border-color: var(--plan); box-shadow: 0 0 0 1px var(--plan); }
.visuel { position: relative; aspect-ratio: 16 / 10; background-color: var(--papier);
  background-image: linear-gradient(var(--papier-2) 1px, transparent 1px), linear-gradient(90deg, var(--papier-2) 1px, transparent 1px); background-size: 16px 16px;
  border-bottom: 1px solid var(--trait); display: grid; place-items: center; color: var(--encre); overflow: hidden; }
.visuel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.visuel .cote-photo { position: absolute; left: 8px; bottom: 8px; font: 500 11px/1 'JetBrains Mono', monospace; color: #2B4C7E; background: #F3EFE6; border: 1px solid #2B4C7E; padding: 4px 6px; border-radius: 3px; }
.visuel svg { width: 100%; height: 100%; }
.texte { display: grid; gap: 2px; padding: 12px 14px 14px; align-content: start; }
.texte b { font-size: 16px; color: var(--plan); font-weight: 700; }
.texte small { color: var(--encre-2); font-size: 12.5px; line-height: 1.35; }
.texte .plus { font-family: var(--mono); font-size: 11.5px; color: var(--plan); margin-top: 4px; }
.coche { position: absolute; top: 10px; right: 10px; z-index: 1; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1.5px solid var(--trait); color: transparent; }
.option[aria-checked="true"] .coche, .option[aria-pressed="true"] .coche { background: var(--plan); border-color: var(--plan); color: #fff; }
.coche svg { width: 12px; height: 12px; }
.credit { font-size: 11px; color: var(--encre-2); margin-top: -8px; }

/* curseurs */
.mesure { display: grid; gap: 14px; padding: 18px; background: #fff; border: 1px solid var(--trait); border-radius: 8px; }
.mesure-val { font-family: var(--mono); font-size: clamp(34px, 7vw, 48px); line-height: 1; color: var(--plan); font-variant-numeric: tabular-nums; }
.mesure-val span { font-size: 18px; color: var(--encre-2); margin-left: 6px; }
.mesure input[type=range] { width: 100%; accent-color: var(--plan); height: 28px; }
.cote { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--encre-2); margin-top: -10px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { font-family: var(--mono); font-size: 12.5px; background: var(--papier); border: 1px solid var(--trait); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.puce[aria-pressed="true"] { background: var(--plan); color: #fff; border-color: var(--plan); }
.sous-mesure { display: grid; gap: 4px; }
.sous-mesure label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.sous-mesure output { font-family: var(--mono); color: var(--plan); }

/* navigation + estimation en direct */
.pied { display: grid; gap: 14px; }
.direct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 12px 14px; border: 1px dashed var(--plan); border-radius: 8px; background: var(--plan-clair); }
.direct span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--plan); font-weight: 600; }
.direct strong { font-family: var(--mono); font-size: 18px; color: var(--plan); font-variant-numeric: tabular-nums; }
.boutons { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: var(--rayon); padding: 12px 22px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--trait); background: #fff; }
.btn:hover { border-color: var(--encre-2); }
.btn.principal { background: var(--plan); border-color: var(--plan); color: #fff; }
.btn.principal:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.invisible { visibility: hidden; }

/* résultat */
.resultat { display: grid; gap: 18px; }
.prix-bloc { display: grid; gap: 6px; padding: 22px; border-radius: 8px; background: var(--encre); color: var(--papier); }
.prix-bloc .etiquette { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.prix-bloc .prix { font-family: var(--mono); font-size: clamp(28px, 6.5vw, 44px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.prix-bloc p { margin: 0; font-size: 13px; opacity: .85; max-width: 60ch; }
.detail { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
.detail li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--trait); font-size: 14px; }
.detail li span:last-child { font-family: var(--mono); white-space: nowrap; }
.detail li.total { font-weight: 700; border-bottom: 0; }
.titre-bloc { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-2); margin-bottom: 6px; }
.inclus { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px 16px; font-size: 14px; }
.inclus li { display: flex; gap: 8px; }
.inclus svg { width: 18px; height: 18px; flex: none; color: var(--ok); margin-top: 1px; }

/* formulaire */
.formulaire { display: grid; gap: 14px; }
.ligne2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.champ { display: grid; gap: 6px; min-width: 0; }
.champ label { font-weight: 600; font-size: 14px; }
.champ input, .champ select, .champ textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--trait); border-radius: var(--rayon); background: #fff; }
.erreur { color: #9A3A1E; font-size: 13px; }
.merci { display: grid; gap: 14px; }
.merci .rond { width: 52px; height: 52px; border-radius: 50%; background: var(--plan-clair); color: var(--plan); display: grid; place-items: center; }
.merci .rond svg { width: 28px; height: 28px; }
.note-demo { font-size: 13px; color: var(--encre-2); background: var(--papier); border: 1px dashed var(--trait); border-radius: 8px; padding: 12px 14px; }

/* ---------- Sections sous l'estimateur ---------- */
.section { padding-block: clamp(48px, 8vw, 88px) 0; scroll-margin-top: 70px; }
.section .wrap { display: grid; gap: 22px; }
.entete-section { display: grid; gap: 10px; max-width: 70ch; }
.entete-section h2 { font-size: clamp(24px, 4vw, 36px); line-height: 1.12; }
.entete-section p { margin: 0; color: var(--encre-2); }
.tarif { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .tarif { grid-template-columns: minmax(0, 1fr); } }
.tarif-carte { background: var(--encre); color: var(--papier); border-radius: 10px; padding: 24px; display: grid; gap: 10px; }
.tarif-carte .etiquette { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.tarif-carte .chiffre { font-family: var(--mono); font-size: 52px; line-height: 1; }
.tarif-carte .chiffre small { font-size: 18px; opacity: .8; margin-left: 4px; }
.tarif-carte ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.tarif-carte li { display: flex; gap: 8px; }
.tarif-carte li svg { width: 16px; height: 16px; flex: none; margin-top: 3px; color: #9DB8E0; }
.tarif-carte .btn { justify-self: start; margin-top: 8px; background: var(--papier); color: var(--encre); border-color: var(--papier); text-decoration: none; }
.tableau { overflow-x: auto; background: #fff; border: 1px solid var(--trait); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 14px; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--trait); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-2); font-weight: 500; background: var(--papier); }
td.num { font-family: var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--plan); }
tr:last-child td { border-bottom: 0; }
th.nous, td.nous { background: var(--plan-clair); }
.note { margin: 0; font-size: 13px; color: var(--encre-2); max-width: 80ch; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.zone { background: #fff; border: 1px solid var(--trait); border-radius: 10px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.zone h3 { font-size: 15px; }
.zone .lieux { display: flex; flex-wrap: wrap; gap: 6px; }
.zone .lieux span { font-size: 13px; background: var(--papier); border: 1px solid var(--trait); border-radius: 999px; padding: 3px 10px; }
.faq { display: grid; gap: 8px; max-width: 860px; }
details { background: #fff; border: 1px solid var(--trait); border-radius: 8px; padding: 14px 18px; }
summary { cursor: pointer; font-weight: 600; }
details p { margin: 10px 0 0; color: var(--encre-2); }
.bas { margin-top: clamp(48px, 8vw, 88px); border-top: 1px solid var(--trait); padding-block: 24px 40px; font-size: 13px; color: var(--encre-2); }
.bas .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; }

@media (prefers-reduced-motion: no-preference) {
  .entre { animation: entre .28s ease both; }
  @keyframes entre { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero h1 .ville { transition: none; } }
@media (max-width: 560px) {
  .nav a { display: none; }
  .choix, .choix.serre { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .visuel { aspect-ratio: 4 / 3; }
  .texte { padding: 10px; }
  .texte b { font-size: 14.5px; }
  .hero .wrap { padding-bottom: 130px; }
}

</style>

<script>
/* Wibzo — calculateur de devis : textes, zones et métiers.
   Tout ce qui change d'une entreprise à l'autre est ici (prix, étapes, textes).
   ⚠️ Prix FICTIFS (moyennes plausibles) : pour un vrai client, reprendre SES tarifs. */

window.TEXTES = {
fr: {
  demo: 'Démo · prix fictifs', calculateur: 'Calculateur de prix', navCalc: 'Calculer le prix', navTarifs: 'Tarifs', navFaq: 'Questions fréquentes',
  pour: n => `Démo préparée pour ${n}`, etape: (a, b) => `Étape ${a} sur ${b}`, a: 'à', aVilles: ['Genève', 'Lausanne', 'Fribourg', 'Neuchâtel', 'Sion'],

// ---------- Aides de calcul (partagées) ----------
function choix(m, id, v) { const e = m.etapes.find(e => e.id === id); return e.opts.find(o => o.v === v) || e.opts[0]; }
function ajouts(m, v, out, L, c) {
  for (const e of m.etapes) {
    if (e.type !== 'options') continue;
    for (const o of e.opts) {
      if (!(v[e.id] || []).includes(o.v)) continue;
      let a = o.p ?? 0;
      if (o.pm) a = o.pm * (c.metres || 0); if (o.pm2) a = o.pm2 * (c.m2 || 0); if (o.pct) a = o.pct * (c.base || 0); if (o.pp) a = o.pp * (c.pieces || 0);
      if (a > 0) out.push([o[L][0], a]);
    }
  }
}
// Applique un pourcentage (urgence, rabais…) au sous-total et l'affiche comme une ligne
function facteur(out, k, L, plus, moins) {
  if (!k || k === 1) return;
  const s = out.reduce((a, l) => a + l[1], 0), pct = Math.round((k - 1) * 100), lib = k > 1 ? plus : moins;
  out.push([`${L === 'de' ? lib[0] : lib[1]} ${pct > 0 ? '+' : '−'}${Math.abs(pct)} %`, s * (k - 1)]);
}

function lireAdresse() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase().split('-').filter(Boolean);

  if (h[0] && M[h[0]]) metier = h.shift();

function parDefaut() {

    if (e.type === 'options') d[e.id] = [];
    if (e.type === 'mesures') e.items.forEach(i => d[i.id] = i.val);

}

  if (r) r.oninput = () => { v[e.id] = +r.value; repondu.add(e.id); $('valeur').innerHTML = `${r.value}<span>${e.unite}</span>`; c.querySelectorAll('.puce').forEach(p => p.setAttribute('aria-pressed', +p.dataset.p === +r.value)); majDirect(); };
  c.querySelectorAll('.puce').forEach(p => p.onclick = () => { v[e.id] = +p.dataset.p; repondu.add(e.id); afficherEtape(); });
  c.querySelectorAll('input[data-m]').forEach(x => x.oninput = () => { v[x.dataset.m] = +x.value; repondu.add(e.id); $('sortie-' + x.dataset.m).textContent = x.value; majDirect(); });
  $('retour').onclick = () => aller(-1);
  $('suivant').onclick = () => { if (!choisi) return; if (e.type !== 'cartes' && e.type !== 'zone') repondu.add(e.id); aller(1); };
}
function carte({ v: val, titre, sous, dessin, coche, radio, plus }) {
  return `<button type="button" class="option" data-v="${val}" ${radio ? `role="radio" aria-checked="${coche}"` : `aria-pressed="${coche}"`}>
    <span class="coche">${COCHE}</span><span class="visuel">${dessin}</span>
    <span class="texte"><b>${titre}</b>${sous ? `<small>${sous}</small>` : ''}${plus ? `<span class="plus">${plus}</span>` : ''}</span></button>`;
}
// Prix ajouté par une option, avec les réponses actuelles
function prixOption(e, o) {
  const sans = { ...v, [e.id]: (v[e.id] || []).filter(x => x !== o.v) }, avec = { ...v, [e.id]: [...(v[e.id] || []).filter(x => x !== o.v), o.v] };
  const d = total(avec) - total(sans); return d > 0 ? `+ ${chf(d)}` : '';
}
function choix(e, val) { return e.opts.find(o => o.v === val) || e.opts[0]; }
function avancerApres() { afficherEtape(); setTimeout(() => aller(1), 260); }
function aller(d) {
  etape = Math.max(0, etape + d); afficherEtape();
  const c = $('calculer'); if (c.getBoundingClientRect().top < 0) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function afficherResultat() {
  const t = T[L], ls = lignes(v), tot = ls.reduce((a, l) => a + l[1], 0), n = etapes().length;
  $('carte').innerHTML = `${enTete(n + 1, n)}<div class="resultat entre">
    <div class="prix-bloc"><div class="etiquette">${t.resultat}${zone ? ` · ${zone.nom}` : ''}</div><div class="prix">${fourchette(tot)}</div><p>${t.resNote}</p></div>
    <div><div class="titre-bloc">${t.detail}</div><ul class="detail">${ls.map(l => `<li><span>${esc(l[0])}</span><span>${l[1] < 0 ? '− ' : ''}${chf(Math.abs(l[1]))}</span></li>`).join('')}<li class="total"><span>${t.total}</span><span>${chf(tot)}</span></li></ul></div>
    <div><div class="titre-bloc">${t.inclus}</div><ul class="inclus">${m().inclus[L].map(x => `<li>${svg('0 0 24 24', PICTOS.bouclier, '')}<span>${x}</span></li>`).join('')}</ul></div>
    <div class="boutons"><button type="button" class="btn" id="retour">${t.retour}</button><button type="button" class="btn principal" id="suivant">${t.offre}</button></div></div>`;
  $('retour').onclick = () => aller(-1); $('suivant').onclick = () => aller(1);
}
function afficherFormulaire() {
  const t = T[L], n = etapes().length, auj = new Date().toISOString().slice(0, 10);
  $('carte').innerHTML = `${enTete(n + 1, n)}<form class="formulaire entre" id="form" novalidate>
    <h2 class="question">${t.offre}</h2>
    <div class="ligne2"><div class="champ"><label for="fNom">${t.nom}</label><input id="fNom" autocomplete="name"></div><div class="champ"><label for="fTel">${t.tel}</label><input id="fTel" type="tel" autocomplete="tel"></div></div>
    <div class="ligne2"><div class="champ"><label for="fMail">${t.mail}</label><input id="fMail" type="email" autocomplete="email"></div><div class="champ"><label for="fNpa">${t.npa}</label><input id="fNpa" autocomplete="postal-code" value="${zone ? esc(zone.lieux[0]) : ''}"></div></div>
    <div class="ligne2"><div class="champ"><label for="fDate">${t.date}</label><input id="fDate" type="date" min="${auj}"></div><div class="champ"><label for="fRappel">${t.rappel}</label><select id="fRappel">${t.creneaux.map(x => `<option>${x}</option>`).join('')}</select></div></div>
    <div class="champ"><label for="fMsg">${t.remarques}</label><textarea id="fMsg" rows="3"></textarea></div>
    <div class="erreur" id="fErr" hidden>${t.manque}</div>
    <div class="boutons"><button type="button" class="btn" id="retour">${t.retour}</button><button type="submit" class="btn principal">${t.envoyer}</button></div></form>`;
  $('retour').onclick = () => aller(-1);
  $('form').onsubmit = e => {
    e.preventDefault();
    if (!$('fTel').value.trim() && !$('fMail').value.trim()) { $('fErr').hidden = false; return; }
    ref = metier.slice(0, 3).toUpperCase() + '-' + String(Date.now()).slice(-6); aller(1);
  };
}
function afficherMerci() {
  const t = T[L], nom = esc(nomAffiche());
  $('carte').innerHTML = `<div class="merci entre"><div class="rond">${COCHE}</div><h2 class="question">${t.merci}</h2><p style="margin:0">${t.merciP(nom)}</p>
    <div>${t.ref} : <b class="mono">${ref}</b></div><div class="note-demo">${t.noteDemo(nom)}</div>
    <div class="boutons"><span></span><button type="button" class="btn" id="encore">${t.recommencer}</button></div></div>`;
  $('encore').onclick = () => { reinitialiser(); lancerVilles(); afficherEtape(); };
}

// ---------- Démarrage ----------
$('choixMetier').onchange = e => { metier = e.target.value; reinitialiser(); afficherPage(); afficherEtape(); };
$('langue').onclick = () => { L = L === 'fr' ? 'de' : 'fr'; zone = null; afficherPage(); afficherEtape(); };

// ---------- Marque du client : logo, couleur, police et menu de son site (marques/<cle>.json) ----------
let marque = null;
async function chargerMarque() {
  const h = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase().split('-').filter(Boolean);
  if (h[0] === 'fr' || h[0] === 'de') h.shift();
  if (h[0] && M[h[0]]) h.shift();
  const cle = h.join('-'); marque = null;
  if (cle) try { const r = await fetch('marques/' + cle + '.json'); if (r.ok) marque = await r.json(); } catch (e) { marque = null; }
  appliquerMarque();
}
function appliquerMarque() {
  const mh = $('marqueHead'), st = document.documentElement.style;
  document.body.classList.toggle('avec-marque', !!marque);
  if (!marque) { mh.hidden = true; return; }
  if (marque.couleur) { st.setProperty('--plan', marque.couleur); st.setProperty('--plan-clair', `color-mix(in srgb, ${marque.couleur} 11%, white)`);
    st.setProperty('--papier', `color-mix(in srgb, ${marque.couleur} 4%, white)`); st.setProperty('--papier-2', `color-mix(in srgb, ${marque.couleur} 9%, white)`);
    st.setProperty('--carte', '#fff'); st.setProperty('--trait', `color-mix(in srgb, ${marque.couleur} 20%, #ddd)`); }
  if (marque.police) {
    if (!$('policeMarque')) { const l = document.createElement('link'); l.id = 'policeMarque'; l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + marque.police.replace(/ /g, '+') + ':wght@400;500;600;700&display=swap'; document.head.appendChild(l); }
    st.setProperty('--sans', `'${marque.police}', system-ui, sans-serif`);
  }
  const liens = (marque.nav || []).map(([t, u]) => `<a href="${esc(u)}">${esc(t)}</a>`).join('') + `<a class="actif" href="#calculer" data-calc>${L === 'de' ? 'Preis berechnen' : 'Calculer le prix'}</a>`;
  mh.innerHTML = `<div class="mh-shell"><a class="mh-logo" href="${esc(marque.site || '#')}">${marque.logo ? `<img src="marques/${esc(marque.logo)}" alt="${esc(entreprise)}">` : `<b>${esc(entreprise)}</b>`}</a>
    <nav class="mh-nav" aria-label="Menu">${liens}</nav>
    <div class="mh-droite"><button type="button" class="mh-l" data-l="fr" aria-pressed="${L === 'fr'}">FR</button><button type="button" class="mh-l" data-l="de" aria-pressed="${L === 'de'}">DE</button><button type="button" class="mh-burger" aria-expanded="false" aria-label="Menu">☰</button></div></div>
    <div class="mh-mobile" hidden>${liens}</div><div class="mh-demo">${esc(T[L].demo)}</div>`;
  mh.hidden = false;
  mh.querySelectorAll('.mh-l').forEach(b => b.onclick = () => { if (L !== b.dataset.l) { L = b.dataset.l; zone = null; afficherPage(); afficherEtape(); appliquerMarque(); } });
  mh.querySelector('.mh-burger').onclick = e => { const mm = mh.querySelector('.mh-mobile'); mm.hidden = !mm.hidden; e.currentTarget.setAttribute('aria-expanded', !mm.hidden); };
  mh.querySelectorAll('[data-calc]').forEach(a => a.onclick = e => { e.preventDefault(); mh.querySelector('.mh-mobile').hidden = true; $('calculer').scrollIntoView({ behavior: 'smooth' }); });
}
addEventListener('hashchange', () => { lireAdresse(); reinitialiser(); afficherPage(); afficherEtape(); chargerMarque(); });
lireAdresse(); reinitialiser(); afficherPage(); afficherEtape(); chargerMarque();
window.__devis = { get etat() { return { L, metier, entreprise, etape, v, zone }; } };
})();

</script>
