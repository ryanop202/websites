<style>

  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #stage{width:1080px;height:1920px;position:relative;background:#11121b;overflow:hidden;transform-origin:center center;flex:none}
  svg{position:absolute;inset:0;width:100%;height:100%}
  svg text{font-family:Inter,system-ui,sans-serif}
  #grain{position:absolute;inset:-50px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
  #subs{position:absolute;left:70px;right:70px;top:1440px;text-align:center;color:#fff;font-size:56px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,0,0,.7)}
  #subs span{display:inline-block;margin:0 .13em}
  #subs .v{color:var(--violet)} #subs .r{color:var(--red)} #subs .l{color:var(--lime)}
  #tag{position:absolute;top:120px;left:0;right:0;text-align:center;color:#9a9cb3;font-size:24px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#6b6d82;font:13px Inter,sans-serif}
</style>
</head>

<script>
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, (innerHeight-26)/1920); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);
const A = (el, o) => { el = typeof el === 'string' ? $(el) : el; for (const k in o) el.setAttribute(k, o[k]); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);
const win = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const backOut = t => { const c=1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const bump = (t, a, b, r = .35) => Math.min(smooth(win(t, a, a + r)), 1 - smooth(win(t, b - r, b)));
const VIOLET = '#8b7bff', LIME = '#c6ff3d', RED = '#ff6b78';

/* ============ construction statique ============ */
const STRIDE = 150, GROUND = 1500, P0 = 2.6, SPEED = .36;
const BLADES = [];
(function(){
  // brins d'herbe de la pelouse (triés du fond vers l'avant)
  const list = [];
  for (let i = 0; i < 340; i++){
    const x = -100 + i*8 + ((i*37) % 7), y = 1446 + ((i*53) % 100);
    list.push({x, y, tall: 34 + ((i*29) % 28), short: 7 + ((i*13) % 5), sway: ((i*17) % 10)/10, c: ['#2f5a3d','#3a6a47','#4b7f52','#2a5038'][i % 4]});
  }
  list.sort((a,b) => a.y - b.y);
  $('blades').innerHTML = list.map((b,i) => `<use href="#bladeArt" fill="${b.c}"/>`).join('');
  list.forEach((b,i) => { b.el = $('blades').children[i]; BLADES.push(b); });
  // barrière
  let f = ''; for (let x = 640; x < 2600; x += 110) f += `<rect x="${x}" y="1300" width="12" height="110" rx="3"/>`;
  f += `<rect x="620" y="1318" width="1980" height="9" rx="4"/><rect x="620" y="1360" width="1980" height="9" rx="4"/>`;
  $('fence').innerHTML = f;
  // brins coupés qui volent
  let c = ''; for (let i = 0; i < 16; i++) c += `<rect width="7" height="3" rx="1.5"/>`;
  $('clips').innerHTML = c;
  // herbes folles chez Marc
  const weeds = (n, y0, y1, h0, h1, seed) => { let s = '';
    for (let i = 0; i < n; i++){ const x = 30 + ((i*83 + seed) % 1020), y = y0 + ((i*41 + seed) % (y1 - y0)), h = h0 + ((i*61 + seed) % (h1 - h0)), lean = ((i*7) % 9) - 4;
      const col = ['#24402e','#2c4d36','#335a3e','#1f3828'][i % 4];
      s += `<path d="M${x-5} ${y} Q${x+lean*2} ${y-h*.6} ${x+lean*6} ${y-h} Q${x+lean*2+3} ${y-h*.5} ${x+5} ${y}Z" fill="${col}"/>`;
      if (i % 5 === 0) s += `<circle cx="${x+lean*6}" cy="${y-h-6}" r="7" fill="#5d6a4a"/>`; }
    return s; };
  $('weedsBack').innerHTML = weeds(70, 1240, 1300, 60, 170, 11);
  $('weedsFront').innerHTML = weeds(60, 1330, 1420, 70, 190, 5);
})();
const QUERY_W = $('query').getComputedTextLength();

/* ============ LE PAYSAGISTE ============ */
function ik(hx, hy, fx, fy, a, b, pick){
  const dx = fx-hx, dy = fy-hy, d = Math.hypot(dx,dy);
  const dc = clamp(d, 1, a+b-1), th = Math.atan2(dy,dx);
  const al = Math.acos(clamp((a*a + dc*dc - b*b)/(2*a*dc), -1, 1));
  const k1 = [hx + a*Math.cos(th-al), hy + a*Math.sin(th-al)], k2 = [hx + a*Math.cos(th+al), hy + a*Math.sin(th+al)];
  return { knee: pick(k1, k2), ankle: [hx + dc*Math.cos(th), hy + dc*Math.sin(th)] };
}
const forward = (k1, k2) => k1[0] > k2[0] ? k1 : k2;   // genou vers l'avant
const below = (k1, k2) => k1[1] > k2[1] ? k1 : k2;     // coude vers le bas
const foot = k => [k*STRIDE + 60, GROUND];
function gait(t){
  const p = P0 + SPEED*t, n = Math.floor(p), f = p - n;
  return {p, n, f, hip:[p*STRIDE + 15, GROUND - 262 - 6*Math.sin(Math.PI*f)], lean: 14 + 1.2*Math.sin(2*Math.PI*f)};
}
const toWorld = (P, x, y) => { const r = P.lean*Math.PI/180, c = Math.cos(r), s = Math.sin(r); return [P.hip[0] + x*c - y*s, P.hip[1] + x*s + y*c]; };

// opt.vib : le téléphone vibre · opt.ear / opt.hands : on souligne le casque / les mains
function renderGarden(t, opt = {}){
  const P = gait(t), {n, f, hip} = P;
  const e = smooth(win(f, .15, .85));
  const planted = foot(n), from = foot(n-1), to = foot(n+1);
  const moving = [lerp(from[0], to[0], e), lerp(from[1], to[1], e) - 34*Math.sin(Math.PI*e)];
  const nearPlanted = n % 2 === 0;
  const fNear = nearPlanted ? planted : moving, fFar = nearPlanted ? moving : planted;
  const leg = (id, shoe, fp) => {
    const r = ik(hip[0], hip[1], fp[0], fp[1]-26, 135, 135, forward);
    A(id, {d:`M${hip[0]} ${hip[1]} L${r.knee[0]} ${r.knee[1]} L${r.ankle[0]} ${r.ankle[1]}`});
    A(shoe, {transform:`translate(${r.ankle[0]-8} ${r.ankle[1]+26}) rotate(${fp === moving ? -6*Math.sin(Math.PI*e) : 0})`});
  };
  leg('legFar','shoeFar',fFar); leg('legNear','shoeNear',fNear);
  A('torso', {transform:`translate(${hip[0]} ${hip[1]}) rotate(${P.lean})`});
  A('shadow', {cx:(fNear[0]+fFar[0])/2 + 10, cy: GROUND - 2});

  // tondeuse, poussée à bout de bras
  const jit = Math.sin(t*63)*1.3;
  const mx = hip[0] + 480, my = GROUND + jit;
  A('mower', {transform:`translate(${mx.toFixed(1)} ${my.toFixed(1)})`});
  A('mowerShadow', {cx: mx - 40, cy: GROUND + 2});
  const rot = (mx/27)*180/Math.PI;
  document.querySelectorAll('#mower .spoke').forEach(s => A(s, {transform:`rotate(${(rot % 360).toFixed(1)})`}));
  const grip = [hip[0] + 152, GROUND - 252 + jit*.5], gripFar = [grip[0] - 8, grip[1] - 6];
  const deck = [mx - 150, my - 84];
  A('handleNear', {d:`M${deck[0]} ${deck[1]} L${grip[0] + 10} ${grip[1] - 10}`});
  A('handleFar', {d:`M${deck[0] - 6} ${deck[1] - 4} L${gripFar[0] + 10} ${gripFar[1] - 10}`});
  const arm = (id, glove, sh, hand) => {
    const r = ik(sh[0], sh[1], hand[0], hand[1], 122, 118, below);
    A(id, {d:`M${sh[0]} ${sh[1]} L${r.knee[0]} ${r.knee[1]} L${r.ankle[0]} ${r.ankle[1]}`});
    A(glove, {cx:r.ankle[0], cy:r.ankle[1]});
  };
  arm('armNear', 'gloveNear', toWorld(P, 14, -194), grip);
  arm('armFar', 'gloveFar', toWorld(P, -4, -196), gripFar);
  // bruit du moteur
  [...$('noise').children].forEach((p, i) => {
    const k = ((t*1.6 + i/3) % 1), r = 30 + k*70;
    A(p, {d:`M${-30 - r*.7} ${-150 - r*.55} Q${-30} ${-150 - r*1.05} ${-30 + r*.7} ${-150 - r*.55}`, opacity:((1-k)*.45).toFixed(2)});
  });
  // pelouse : coupée derrière la tondeuse, haute devant
  const cutX = mx - 40;
  A('lawnCut', {width: Math.max(0, cutX + 100)});
  [...$('lawnStripes').children].forEach((p, i) => A(p, {d:`M-100 ${1462 + i*32} H${cutX}`}));
  for (const b of BLADES){
    const cut = b.x < cutX;
    const h = cut ? b.short : b.tall;
    const near = !cut && b.x < cutX + 260 ? (1 - (b.x - cutX)/260) : 0;     // la tondeuse plie l'herbe devant elle
    const sway = Math.sin(t*1.7 + b.sway*6)*4 + near*14;
    A(b.el, {transform:`translate(${b.x} ${b.y}) rotate(${sway.toFixed(1)}) scale(1 ${h})`});
  }
  [...$('clips').children].forEach((c, i) => {
    const k = ((t*1.9 + i/16) % 1), x = mx - 168 - k*150 - (i % 4)*12, y = GROUND - 20 - Math.sin(k*Math.PI)*(50 + (i % 5)*14);
    A(c, {x:x.toFixed(1), y:y.toFixed(1), opacity:((1-k)*.9).toFixed(2), transform:`rotate(${(k*360 + i*40).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})`});
  });

  // téléphone dans la poche arrière
  const vib = !!opt.vib;
  A('phone', {transform:`translate(${vib ? (Math.sin(t*90)*2.2).toFixed(2) : 0} 0)`});
  A('pGlow', {opacity: vib ? (.55 + .35*Math.sin(t*12)).toFixed(2) : 0});
  A('haptic', {opacity: vib ? (.5 + .5*Math.sin(t*14)).toFixed(2) : 0});
  A('pScreen', {stroke: opt.missed ? RED : VIOLET});
  A('earGlow', {opacity: (opt.ear || 0)*(.45 + .25*Math.sin(t*6))});
  const hw = toWorld(P, 0, 0);
  A('handGlow', {cx: grip[0], cy: grip[1], opacity: (opt.hands || 0)*(.45 + .25*Math.sin(t*6))});

  const ph = toWorld(P, -44, 6), head = toWorld(P, 6, -262);
  return {ph, head, grip, hip, base: {cx: hip[0] + 300, cy: GROUND - 330, z: 1.25}};
}

/* ============ MARC ============ */
function renderMarc(t){
  A('marcHead', {transform:`rotate(${(1.6*Math.sin(t*1.2)).toFixed(2)} 542 880)`});
  A('marcGlow', {opacity:(.7 + .3*Math.sin(t*3)).toFixed(2)});
  const sw = (1.2*Math.sin(t*1.1)).toFixed(2);
  A('weedsFront', {transform:`skewX(${sw})`}); A('weedsBack', {transform:`skewX(${(-sw*.7).toFixed(2)})`});
}

/* ============ TÉLÉPHONE DE MARC ============ */
function tap(t, t0, x, y){
  const a = win(t, t0-.5, t0-.05), r = win(t, t0, t0+.45);
  return {a, x, y, press: t >= t0 && t < t0+.12, ripple: r};
}
function renderPhone(T){
  const typed = win(T, 7.85, 8.35);
  A('typeRect', {width: typed*(QUERY_W + 24)});
  A('caret', {x: 362 + typed*QUERY_W + 2, opacity: T < 8.6 ? (Math.sin(T*9) > 0 ? 1 : 0) : 0});
  const res1 = win(T, 8.4, 8.7);
  A('res1', {opacity:res1.toFixed(2), transform:`translate(0 ${((1-easeOut(res1))*30).toFixed(1)})`});
  const pulse = T > 9.3 && T < 10.9 ? Math.abs(Math.sin((T-9.3)*Math.PI*2)) : 0;
  A('noSite', {transform:`translate(438 546) scale(${(1 + .09*pulse).toFixed(3)}) translate(-438 -546)`});
  A('btnCall', {transform: T > 11.0 && T < 11.12 ? 'translate(425 649) scale(.95) translate(-425 -649)' : ''});
  const call = win(T, 11.15, 11.35);
  A('callUI', {opacity: call.toFixed(2)});
  document.querySelectorAll('#callUI .ring').forEach((c,i) => {
    const ph = (((T - 11.3) - i*.5) % 1.1 + 1.1) % 1.1, on = T > 11.3 + i*.5;
    A(c, {r: 100 + ph*110, opacity: on ? ((1-ph/1.1)*.8).toFixed(2) : 0});
  });
  const f = T > 10.4 && T < 11.5 ? tap(T, 11.0, 425, 650) : null;
  if (f){
    A('finger', {opacity: (f.a*(1 - win(T, 11.2, 11.45))).toFixed(2), transform:`translate(${f.x + (1-f.a)*120} ${f.y + (1-f.a)*200}) scale(${f.press ? .85 : 1})`});
    A('ripple', {r: 30 + f.ripple*50, opacity: f.ripple > 0 && f.ripple < 1 ? (1-f.ripple).toFixed(2) : 0});
  } else A('finger', {opacity:0});
}

/* ============ FILS ============ */
const wireCache = {};
function wirePath(id, d){
  const el = $(id), c = wireCache[id] || (wireCache[id] = {d:'', len:0});
  if (d !== c.d){ A(el, {d}); c.d = d; c.len = el.getTotalLength(); }
  return c.len;
}
function pointAt(id, frac){ const el = $(id), L = wireCache[id].len; const p = el.getPointAtLength(clamp(frac,0,1)*L); return [p.x, p.y]; }
const NODES = [.14, .32, .5, .68, .86];
function drawWire(id, a, b, color, show, z){
  const el = $(id), L = wireCache[id] ? wireCache[id].len : 0;
  const nodes = $(id + 'Nodes').children;
  if (!L || b <= a || show <= 0){
    A(el, {opacity:0}); A(id + 'Head', {opacity:0});
    for (const nd of nodes) A(nd, {opacity:0});
    return;
  }
  A(el, {stroke:color, opacity:show.toFixed(2), 'stroke-dasharray':`${(L*(b-a)).toFixed(1)} ${(L*3).toFixed(1)}`, 'stroke-dashoffset': (-L*a).toFixed(1)});
  const hp = pointAt(id, b);
  A(id + 'Head', {cx:hp[0], cy:hp[1], r:(9/z).toFixed(1), fill:'#ffffff', opacity: b < .999 ? show.toFixed(2) : 0});
  NODES.forEach((fr, i) => {
    const on = fr > a && fr < b, p = pointAt(id, fr);
    A(nodes[i], {cx:p[0], cy:p[1], r:(5.5/z).toFixed(1), fill:color, opacity: on ? (show*.9).toFixed(2) : 0});
  });
}

/* ============ CAMÉRA ============ */
// le décor est une grande carte : chaque lieu a sa place, la caméra voyage entre eux
const mixCam = (c1, c2, e) => ({cx: lerp(c1.cx, c2.cx, e), cy: lerp(c1.cy, c2.cy, e), z: Math.exp(lerp(Math.log(c1.z), Math.log(c2.z), e))});
const PW = (x, y) => [-494 + .62*x, -1988 + .62*y];       // point de l'écran du téléphone de Marc -> décor
const MARC_CAM  = {cx:-910, cy:-1390, z:.95};
const PANEL_CAM = {cx:-159, cy:-1530, z:1.45};
const RES_CAM   = {cx:-159.2, cy:-1650, z:1.95};
const B_CALL = PW(540, 1298);
const curve = (p, q, d1, d2) => `M${p[0]} ${p[1]} C ${p[0]+d1[0]} ${p[1]+d1[1]}, ${q[0]+d2[0]} ${q[1]+d2[1]}, ${q[0]} ${q[1]}`;

/* ============ SOUS-TITRES & ÉTIQUETTES ============ */
// *mot* violet · !mot! rouge · ~mot~ vert Wibzo
const LINES = [
  {a:0.2,  b:3.4,  d:2.6, text:'Ce paysagiste vient de perdre un chantier à !douze! !mille! !francs.!'},
  {a:3.5,  b:5.2,  d:1.3, text:'Et il ne le sait même pas.'},
  {a:5.3,  b:7.6,  d:2.0, text:'Ce matin, Marc cherche un *paysagiste* sur Google.'},
  {a:7.7,  b:9.1,  d:1.1, text:'Il tombe sur ce paysagiste.'},
  {a:9.2,  b:10.9, d:1.4, text:'!Pas! !de! !site.! Juste un *numéro.*'},
  {a:11.0, b:11.8, d:.6,  text:'Il *appelle.*'},
  {a:11.9, b:13.9, d:1.8, text:'Mais le paysagiste est en train de *tondre.*'},
  {a:14.0, b:15.8, d:1.4, text:'Il n’entend rien. !Messagerie.!'},
  {a:16.0, b:17.2, d:1.0, text:'Le problème est là :'},
  {a:17.3, b:20.4, d:2.7, text:'sans site, son *téléphone* est la seule façon de le contacter.'},
  {a:20.5, b:23.6, d:2.2, text:'Et quand il travaille, il ne peut pas !répondre.!'},
];
const TAGS = [
  {a:6.4, b:9.0, text:'Ce matin · 9:04'},
];
let curLine = -2;
function renderSubs(T){
  const i = LINES.findIndex(l => T >= l.a && T < l.b);
  const el = $('subs');
  if (i !== curLine){
    curLine = i;
    el.innerHTML = i < 0 ? '' : LINES[i].text.split(' ').map(w => {
      if (w.startsWith('*')) return `<span class="v">${w.replace(/\*/g,'')}</span>`;
      if (w.startsWith('!')) return `<span class="r">${w.replace(/!/g,'')}</span>`;
      if (w.startsWith('~')) return `<span class="l">${w.replace(/~/g,'')}</span>`;
      return `<span>${w}</span>`; }).join(' ');
  }
  if (i >= 0){
    const L = LINES[i], sp = el.children, n = sp.length;
    for (let j=0;j<n;j++){ const r = clamp((T - L.a - j*L.d/n)/.14, 0, 1);
      sp[j].style.opacity = (.18 + .82*r).toFixed(3); sp[j].style.transform = `translateY(${((1-r)*10).toFixed(1)}px)`; }
  }
  const tg = TAGS.find(g => T >= g.a && T < g.b), te = $('tag');
  te.textContent = tg ? tg.text : '';
  te.style.opacity = tg ? Math.min(win(T, tg.a, tg.a+.4), 1 - win(T, tg.b-.4, tg.b)).toFixed(2) : 0;
}

/* ============ MONTAGE ============ */
const DUR = 24.0;

function render(TT){
  const vib = TT < 5.4 || (TT > 12.2 && TT < 14.9);
  const missed = TT >= 14.9;
  const ear = Math.max(bump(TT, 12.9, 15.8, .3), bump(TT, 20.5, 24.5, .3));
  const hands = bump(TT, 20.7, 24.5, .3);
  const st = renderGarden(TT, {vib, missed, ear, hands});
  renderMarc(TT);
  const pop = easeOut(win(TT, 7.45, 7.85));
  A('S_phone', {opacity: pop.toFixed(2), transform:`translate(-159.2 -1541.6) scale(${(.62*(.9 + .1*pop)).toFixed(4)}) translate(-540 -720)`});
  renderPhone(TT);

  wirePath('wA', curve(B_CALL, st.ph, [40, 700], [-220, -1000]));
  drawWire('wA', 0, 0, VIOLET, 0, 1);   // on efface, puis on redessine seulement si besoin
  const wires = [];
  // caméra du jardin : gros plan sur la poche, puis on recule
  let gcam = st.base;
  if (TT < 5.3){
    const e2 = smooth(win(TT, 1.9, 4.3));
    gcam = {cx: lerp(st.ph[0], st.base.cx, e2), cy: lerp(st.ph[1] + 40, st.base.cy, e2), z: lerp(2.4, 1.0, e2)*(1 + .04*smooth(win(TT, 4.3, 5.3)))};
  } else if (TT >= 16){
    gcam = {...st.base, cy: st.base.cy - 40*smooth(win(TT, 16, 17.2)), z: lerp(1.25, 1.12, smooth(win(TT, 16, 17.2)))};
  }
  const panelCam = mixCam(mixCam(MARC_CAM, PANEL_CAM, smooth(win(TT, 7.6, 8.2))), RES_CAM, bump(TT, 8.9, 11.6, .4));
  let cam;

  if (TT < 5.3){
    // 1. accroche : l'appel arrive par le fil, il ne l'entend pas
    cam = gcam;
    wires.push(['wA', 0, lerp(.55, 1, easeOut(win(TT, 0, .45))), VIOLET, 1]);
  } else if (TT < 6.5){
    // 2. on remonte le fil jusqu'à Marc (pas de phrase de transition)
    const k = easeInOut(win(TT, 5.3, 6.3)), b = 1 - k;
    const hp = pointAt('wA', b);
    cam = mixCam(mixCam(gcam, {cx: hp[0], cy: hp[1] + 120, z: .42}, smooth(win(TT, 5.3, 5.75))), MARC_CAM, smooth(win(TT, 5.95, 6.5)));
    wires.push(['wA', 0, b, VIOLET, .85]);
  } else if (TT < 11.35){
    // 3. Marc, son jardin à refaire, puis son téléphone en grand
    cam = panelCam;
  } else if (TT < 12.95){
    // 4. il appelle : on suit le fil jusqu'à la poche du paysagiste
    const k = easeInOut(win(TT, 11.35, 12.75));
    const hp = pointAt('wA', k);
    cam = mixCam(mixCam(panelCam, {cx: hp[0], cy: hp[1] + 100, z: .45}, smooth(win(TT, 11.35, 11.8))), gcam, smooth(win(TT, 12.35, 12.95)));
    wires.push(['wA', 0, k, VIOLET, 1]);
  } else {
    // 5. ça vibre sous le bruit de la tondeuse… messagerie. Puis le problème.
    cam = gcam;
    const red = win(TT, 14.9, 15.3);
    wires.push(['wA', 0, 1, red > .5 ? RED : VIOLET, (1 - .6*red)*(1 - win(TT, 16.2, 16.8))]);
  }

  A('world', {transform:`translate(540 860) scale(${cam.z.toFixed(4)}) translate(${(-cam.cx).toFixed(1)} ${(-cam.cy).toFixed(1)})`});
  wires.forEach(w => drawWire(w[0], w[1], w[2], w[3], w[4], cam.z));
  const S = w => [540 + (w[0]-cam.cx)*cam.z, 860 + (w[1]-cam.cy)*cam.z];
  const inGarden = TT < 5.3 || TT > 12.6;

  // pastilles
  const sp = S(st.ph), sh = S(st.head), sg = S(st.grip);
  const inA = Math.max(win(TT, .45, .75)*(1 - win(TT, 5.0, 5.3)), win(TT, 12.75, 13.05)*(1 - win(TT, 14.75, 14.95)));
  $('pillInSub').textContent = TT > 10 ? 'Marc · nouveau client' : 'Numéro inconnu';
  const pinPos = TT < 5.3 ? [clamp(sp[0] - 170, 40, 700), sp[1] - 250] : [60, 470];
  A('pillIn', {opacity:inA.toFixed(2), transform:`translate(${pinPos[0].toFixed(1)} ${(pinPos[1] + (1-easeOut(inA))*16).toFixed(1)})`});
  const missA = win(TT, 14.9, 15.15)*(1 - win(TT, 16.6, 16.9));
  A('pillMiss', {opacity:missA.toFixed(2), transform:`translate(60 478) scale(${(.85 + .15*smooth(missA)).toFixed(3)})`});
  A('pillEar', {opacity:(inGarden ? ear : 0).toFixed(2), transform:`translate(${(sh[0] + 100).toFixed(1)} ${(sh[1] - 60).toFixed(1)})`});
  A('pillHands', {opacity:(inGarden ? hands : 0).toFixed(2), transform:`translate(${(sg[0] - 60).toFixed(1)} ${(sg[1] + 70).toFixed(1)})`});

  // accroche : 12 000 CHF, barré
  const amtOut = win(TT, 4.9, 5.3);
  A('hookAmt', {opacity:(1 - amtOut).toFixed(2), transform:`translate(0 ${(-amtOut*30).toFixed(1)})`});
  const strike = easeOut(win(TT, .8, 1.15));
  A('amtStrike', {width:(900*strike).toFixed(1)});
  const hit = Math.max(0, 1 - Math.abs(TT - 1.15)/.25);
  A('amtText', {fill: strike > .5 ? '#ffd6da' : '#ffffff', transform:`translate(540 340) scale(${(1 + .05*hit).toFixed(3)}) translate(-540 -340)`});

  // le problème
  const pc = easeOut(win(TT, 17.2, 17.6));
  A('probCard', {opacity:pc.toFixed(2), transform:`translate(540 345) scale(${(.92 + .08*backOut(win(TT, 17.2, 17.6))).toFixed(3)}) translate(-540 -345)`});
  A('probRow', {opacity: win(TT, 17.9, 18.3).toFixed(2)});

  A('fade', {opacity: win(TT, DUR - .5, DUR).toFixed(2)});
  renderSubs(TT);
  $('grain').style.backgroundPosition = `${(TT*997)%240}px ${(TT*631)%240}px`;
}

/* ============ CALAGE SUR LA VOIX ============ */
// pas encore de voix : temps réel = temps montage
const ANCHORS = [[0, 0], [DUR, DUR]];
const REAL_DUR = ANCHORS[ANCHORS.length - 1][1];
function designAt(r){
  for (let i = 0; i < ANCHORS.length - 1; i++){
    const [d0, r0] = ANCHORS[i], [d1, r1] = ANCHORS[i + 1];
    if (r <= r1) return d0 + (r - r0)*(d1 - d0)/(r1 - r0);
  }
  return DUR;
}

/* ============ LECTURE ============ */
const q = new URLSearchParams(location.search);
const STILL = q.get('t');
let t0 = performance.now(), paused = false, pauseAt = 0;
function loop(now){
  if (!paused){ const T = ((now - t0)/1000) % (REAL_DUR + 1); render(designAt(Math.min(T, REAL_DUR))); }
  requestAnimationFrame(loop);
}
if (STILL !== null){ render(+STILL); $('hint').remove(); }
else requestAnimationFrame(loop);
window.renderAt = r => render(designAt(r)); window.renderDesign = render; window.DUR = REAL_DUR;
stage.addEventListener('click', () => { paused = !paused; if (paused) pauseAt = performance.now(); else t0 += performance.now() - pauseAt; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r'){ t0 = performance.now(); paused = false; }
  if (k === 'arrowright') t0 -= 2000;
  if (k === 'arrowleft') t0 += 2000;
});
</script>
