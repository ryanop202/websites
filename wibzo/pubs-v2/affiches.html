<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiches Wibzo v2</title>
<link rel="stylesheet" href="kit.css">
<style>
#f { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0D0F0E; font-family: D; color: #F2F0EA; }
.bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size: 90px 90px; }
.glow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(198,255,61,.20), transparent); }
.bar { position: absolute; left: 60px; right: 60px; bottom: 56px; height: 118px; border-radius: 999px; background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center; gap: 20px; font: 800 44px/1 D; letter-spacing: -.02em; box-shadow: 0 24px 60px -20px rgba(37,211,102,.7); }
.bar svg { width: 60px; height: 60px; }
.bar b { font: 800 46px/1 B; letter-spacing: -.02em; }
.pill { display: inline-block; padding: 14px 26px; border-radius: 999px; border: 3px solid #C6FF3D; color: #C6FF3D; font: 800 30px/1 D; letter-spacing: .02em; text-transform: uppercase; }
.stampg { position: absolute; padding: 18px 40px 22px; border: 14px solid #C6FF3D; border-radius: 30px; color: #C6FF3D; background: rgba(13,15,14,.9); font: 800 120px/1 B; letter-spacing: -.03em; text-transform: uppercase; transform: rotate(-9deg); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.light { background: #F2EEE5 !important; color: #141414; }
.light .bg { background-image: linear-gradient(rgba(0,0,0,.035) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.035) 2px, transparent 2px); }
.rc { position: absolute; width: 560px; padding: 44px 46px 40px; background: #fff; color: #141414; font-family: "Courier New", monospace; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.08); }
.rc:before, .rc:after { content: ""; position: absolute; left: 0; right: 0; height: 18px; background: linear-gradient(-45deg, transparent 12px, #fff 0) 0 0/24px 18px repeat-x, linear-gradient(45deg, transparent 12px, #fff 0) 0 0/24px 18px repeat-x; }
.rc:before { top: -17px; transform: rotate(180deg); }
.rc:after { bottom: -17px; }
.rc h3 { font: 800 40px/1 B; letter-spacing: -.02em; text-align: center; }
.rc .sub { text-align: center; margin-top: 8px; font: 700 20px/1 "Courier New", monospace; color: #666; }
.rc .ln { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 2px dashed #ccc; font: 700 26px/1.2 "Courier New", monospace; }
.rc .ln b { white-space: nowrap; }
.rc .tot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; font: 800 40px/1 B; }
.rc .tot b { font-size: 76px; letter-spacing: -.03em; background: #C6FF3D; padding: 2px 12px 6px; border-radius: 10px; }
.rc .bc { margin-top: 26px; height: 54px; background: repeating-linear-gradient(90deg, #141414 0 3px, transparent 3px 6px, #141414 6px 7px, transparent 7px 11px, #141414 11px 15px, transparent 15px 17px); }
</style>
