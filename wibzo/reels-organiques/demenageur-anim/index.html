<!doctype html>
<html lang="fr">
<head>

<style>
  :root{
    --bg:#11121b; --wall:#161826; --floor:#0e0f17; --panel:#1a1c29; --line:#2a2d3f;
    --violet:#8b7bff; --violet2:#6d5df5; --red:#ff6b78; --warm:#f5d27a; --text:#ecebf5; --muted:#8a8ca3;
  }
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #stage{width:1080px;height:1920px;position:relative;background:var(--bg);overflow:hidden;transform-origin:center center;flex:none}
  svg{position:absolute;inset:0;width:100%;height:100%}
  #subs{position:absolute;left:60px;right:60px;top:1400px;text-align:center;color:#fff;font-size:54px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
  #subs span{display:inline-block;margin:0 .14em;opacity:.22}
  #subs .v{color:var(--violet)} #subs .r{color:var(--red)}
  #tag{position:absolute;top:110px;left:0;right:0;text-align:center;color:var(--muted);font-size:24px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;opacity:0}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#6b6d82;font:13px Inter,sans-serif}
</style>
</head>

<script>
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, (innerHeight-30)/1920); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

(function(){
  let e = 'M0 1300 ';
  for(let i=0;i<9;i++){ const x=i*135, y=1300-i*75; e+=`L${x} ${y} L${x+135} ${y} `; }
  document.getElementById('stairs').setAttribute('d', e + 'L1080 1920 L0 1920Z');
  document.getElementById('stairEdge').setAttribute('d', e);
})();

function prepLine(id){ const p=document.getElementById(id), L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; }
['line3','line4'].forEach(prepLine);

// ?t=12.5 : image fixe à 12,5 s (pour vérifier une scène)
const STILL = new URLSearchParams(location.search).get('t');
const subs = document.getElementById('subs'), tagEl = document.getElementById('tag');
// *mot* = violet, !mot! = rouge
function say(tl, t, text, dur){
  tl.call(() => {
    const words = text.split(' ');
    subs.innerHTML = words.map(w => {
      if (w.startsWith('*')) return `<span class="v">${w.replace(/\*/g,'')}</span>`;
      if (w.startsWith('!')) return `<span class="r">${w.replace(/!/g,'')}</span>`;
      return `<span>${w}</span>`;
    }).join(' ');
    if (STILL) gsap.set('#subs span', {opacity:1});
    else gsap.to('#subs span', {opacity:1, duration:.12, stagger:(dur||1.4)/words.length});
  }, null, t);
}
function tag(tl, t, text){
  tl.call(()=>{ tagEl.textContent=text; gsap.fromTo(tagEl,{opacity:0,y:-10},{opacity:1,y:0,duration:.4}); }, null, t);
}
function untag(tl, t){ tl.call(()=>gsap.to(tagEl,{opacity:0,duration:.3}), null, t); }
function tap(tl, t, x, y){
  tl.to('#finger', {attr:{cx:x, cy:y}, opacity:1, duration:.45, ease:'power2.inOut'}, t)
    .to('#finger', {attr:{r:28}, duration:.1, yoyo:true, repeat:1}, t+.5);
}

const tl = gsap.timeline({repeat:-1, repeatDelay:1.2});

// ---- 1. Ouverture sur lui (0 – 5.4)
tl.fromTo('#mover', {x:-135, y:75}, {x:0, y:0, duration:5.2, ease:'none'}, 0)
  .to('#pocketGlow', {opacity:.9, duration:.3}, .3)
  .to('#vib', {opacity:1, duration:.2}, .3)
  .to('#pocket', {x:3, duration:.06, yoyo:true, repeat:36, ease:'none'}, .3)
  .to(['#vib','#pocketGlow'], {opacity:0, duration:.3}, 2.8)
  .fromTo('#pillMiss', {opacity:0, scale:.8, svgOrigin:'285 978'}, {opacity:1, scale:1, duration:.35, ease:'back.out(2)'}, 3.0);
say(tl, .3, 'Ce déménageur vient de perdre un *gros* *client.*', 2.0);
say(tl, 3.1, 'Et il ne le sait même pas.', 1.3);

// ---- 2. Retour en arrière (5.4 – 6.6)
tl.fromTo('#rew', {opacity:0}, {opacity:1, duration:.3}, 5.4)
  .fromTo('#rew circle', {scale:.6, svgOrigin:'540 900'}, {scale:1, duration:.4, ease:'back.out(2)'}, 5.4)
  .to('#s3', {opacity:0, duration:.1}, 6.2)
  .set('#s1', {opacity:1}, 6.2)
  .to('#rew', {opacity:0, duration:.4}, 6.4);
say(tl, 5.6, 'Deux minutes plus tôt.', .8);

// ---- 3. Julie au bureau (6.6 – 10.6)
tag(tl, 6.7, '12:15 · pause de midi');
tl.fromTo('#bailInner', {scale:.5, opacity:0}, {scale:1, opacity:1, transformOrigin:'50% 50%', duration:.5, ease:'back.out(2)'}, 6.9)
  .fromTo('#bailCheck', {scale:0}, {scale:1, transformOrigin:'50% 50%', duration:.4, ease:'back.out(3)'}, 7.4)
  .to('#julPhone', {stroke:'#fff', duration:.3, yoyo:true, repeat:1}, 9.4);
say(tl, 7.0, 'Julie vient de signer son *bail.*', 1.2);
say(tl, 8.6, 'Elle cherche un déménageur.', 1.0);
tl.to('#s1', {scale:3.2, svgOrigin:'541 913', opacity:0, duration:.7, ease:'power2.in'}, 10.0)
  .fromTo('#s2', {opacity:0, scale:.85, svgOrigin:'540 720'}, {opacity:1, scale:1, duration:.6, ease:'power2.out'}, 10.4);
untag(tl, 10.0);

// ---- 4. Recherche, appel, messagerie (10.6 – 15.8)
tl.fromTo('#typeRect', {attr:{width:0}}, {attr:{width:420}, duration:1.0, ease:'steps(20)'}, 10.8)
  .fromTo('#res1', {opacity:0, y:30}, {opacity:1, y:0, duration:.5}, 11.9)
  .to('#noSite', {scale:1.08, svgOrigin:'446 553', duration:.25, yoyo:true, repeat:3}, 12.3);
say(tl, 12.1, 'Pas de site. Juste un *numéro.*', 1.1);
tap(tl, 12.9, 430, 644);
say(tl, 13.5, 'Elle appelle.', .5);
tl.to('#finger', {opacity:0, duration:.2}, 13.6)
  .fromTo('#callUI', {opacity:0}, {opacity:1, duration:.3}, 13.6)
  .fromTo('.ring', {attr:{r:95}, opacity:.8}, {attr:{r:190}, opacity:0, duration:1.0, stagger:.5, repeat:1, ease:'power1.out'}, 13.7)
  .fromTo('#voicemail', {opacity:0, scale:.8, svgOrigin:'540 807'}, {opacity:1, scale:1, duration:.3, ease:'back.out(2)'}, 15.0)
  .set('#callState', {textContent:'Appel terminé'}, 15.0);
say(tl, 15.0, '!Messagerie.!', .3);

// ---- 5. Le site du concurrent (15.8 – 21.4)
tl.to('#callUI', {opacity:0, duration:.35}, 15.9)
  .fromTo('#res2', {opacity:0, y:30}, {opacity:1, y:0, duration:.5}, 16.1);
say(tl, 16.1, 'Deuxième résultat : un *site.*', 1.0);
tap(tl, 16.7, 450, 974);
tl.to('#finger', {opacity:0, duration:.15}, 17.3)
  .fromTo('#siteUI', {opacity:0}, {opacity:1, duration:.35}, 17.3);
tap(tl, 17.5, 564, 520);
tl.to('#chip3', {fill:'#6d5df5', stroke:'#6d5df5', duration:.2}, 18.05).to('#chip3t', {fill:'#fff', duration:.2}, 18.05);
tap(tl, 18.1, 510, 667);
tl.to('#chipDate', {fill:'#6d5df5', stroke:'#6d5df5', duration:.2}, 18.65).to('#chipDatet', {fill:'#fff', duration:.2}, 18.65)
  .set('#chipDatet', {textContent:'Samedi 15 novembre'}, 18.65);
tap(tl, 18.7, 375, 814);
tl.to('#chipPiano', {fill:'#6d5df5', stroke:'#6d5df5', duration:.2}, 19.25).to('#chipPianot', {fill:'#fff', duration:.2}, 19.25);
say(tl, 17.9, '*Trente* *secondes,* et sa demande est partie.', 1.8);
tap(tl, 19.4, 540, 946);
tl.to('#btnQuote', {fill:'#5442e0', duration:.15}, 19.9)
  .to('#finger', {opacity:0, duration:.15}, 20.0)
  .fromTo('#sent', {opacity:0}, {opacity:1, duration:.35}, 20.1)
  .to('#line3', {opacity:1, duration:.1}, 20.3)
  .fromTo('#line3', {strokeDashoffset:()=>document.getElementById('line3').getTotalLength()}, {strokeDashoffset:0, duration:.9, ease:'power2.in'}, 20.3);

// ---- 6. Chez le concurrent (21.2 – 23.8)
tl.to(['#s2','#line3'], {y:1920, duration:.7, ease:'power2.inOut'}, 21.2)
  .set('#line3', {opacity:0}, 21.95)
  .fromTo('#s5', {opacity:1, y:-1920}, {y:0, duration:.7, ease:'power2.inOut'}, 21.2)
  .to('#line4', {opacity:1, duration:.1}, 21.8)
  .fromTo('#line4', {strokeDashoffset:()=>document.getElementById('line4').getTotalLength()}, {strokeDashoffset:0, duration:.6, ease:'power2.out'}, 21.8)
  .fromTo('#newReq', {opacity:0, scale:.85, svgOrigin:'540 610'}, {opacity:1, scale:1, duration:.4, ease:'back.out(2)'}, 22.35);
say(tl, 21.9, 'Chez le !concurrent.!', .6);

// ---- 7. Il rappelle, elle ne décroche pas (23.8 – 31)
tl.set('#s3', {opacity:1}, 23.8)
  .set(['#pillMiss','#line4'], {opacity:0}, 23.8)
  .to('#s5', {y:-1920, duration:.7, ease:'power2.inOut'}, 23.8)
  .fromTo('#s3', {y:1920}, {y:0, duration:.7, ease:'power2.inOut', immediateRender:false}, 23.8)
  .to('#sofa', {x:-210, y:300, duration:.8, ease:'power2.inOut'}, 24.6)
  .to('#armUp', {opacity:0, duration:.2}, 25.0)
  .to(['#armEar','#earPhone'], {opacity:1, duration:.25}, 25.2)
  .to('#pocket', {opacity:0, duration:.2}, 25.2)
  .fromTo('#pillCall', {opacity:0, x:20}, {opacity:1, x:0, duration:.35}, 25.4)
  .to('#callDot', {opacity:.2, duration:.35, yoyo:true, repeat:5}, 25.6);
say(tl, 24.3, 'Lui, il *rappelle.*', .8);
// côté Julie : ça sonne dans le vide
tl.set('#s2', {y:0, opacity:1}, 26.6)
  .set('#line3', {opacity:0}, 26.6)
  .to('#s3', {opacity:0, duration:.4}, 26.6)
  .fromTo('#incoming', {y:-220}, {y:0, duration:.4, ease:'back.out(1.6)'}, 27.0)
  .to('#incoming', {x:4, duration:.06, yoyo:true, repeat:24, ease:'none'}, 27.4)
  .to('#incoming', {y:-220, duration:.4, ease:'power2.in'}, 29.4);
say(tl, 26.8, 'Mais elle ne décroche plus.', 1.0);
say(tl, 28.3, 'Elle a déjà ce qu’il lui faut.', 1.1);
tl.to('#stage svg, #subs, #tag', {opacity:0, duration:.6}, 30.4)
  .set('#stage svg, #subs, #tag', {opacity:1}, 31.0);

tl.eventCallback('onRepeat', () => {
  subs.innerHTML=''; tagEl.style.opacity=0;
  gsap.set('#chipDatet', {textContent:'Choisir une date'});
  gsap.set('#callState', {textContent:'Appel en cours…'});
});

if (STILL !== null) { tl.seek(+STILL, false).pause(); gsap.globalTimeline.getChildren(false).forEach(t => t !== tl && t.progress(1)); document.getElementById('hint').remove(); }

stage.addEventListener('click', () => tl.paused(!tl.paused()));
addEventListener('keydown', e => { if (e.key.toLowerCase()==='r') { subs.innerHTML=''; tl.restart(); } });
</script>
</body>
</html>
