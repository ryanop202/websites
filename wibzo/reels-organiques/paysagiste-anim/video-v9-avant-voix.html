  body{display:flex;align-items:center;justify-content:center}
  #stage{width:1080px;height:1920px;position:relative;background:#11121b;overflow:hidden;transform-origin:center center;flex:none}

  #subs .v{color:var(--violet)} #subs .r{color:var(--red)} #subs .l{color:var(--lime)}
  #tag{position:absolute;top:120px;left:0;right:0;text-align:center;color:#9a9cb3;font-size:24px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#6b6d82;font:13px Inter,sans-serif}
</style>

<script>
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, (innerHeight-26)/1920); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);
const A = (el, o) => { el = typeof el === 'string' ? $(el) : el; for (const k in o) el.setAttribute(k, o[k]); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);
const win = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const backOut = t => { const c=1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const mod1 = x => ((x % 1) + 1) % 1;
const bump = (t, a, b, r = .35) => Math.min(smooth(win(t, a, a + r)), 1 - smooth(win(t, b - r, b)));
const VIOLET = '#8b7bff', LIME = '#c6ff3d', RED = '#ff6b78';
const GROUND = 1500, EX = 700;          // sol du chantier, position de la mini-pelle
const RG = 1262;                         // sol du chantier concurrent (repère local)

/* ============ construction statique ============ */
(function(){
  let f = ''; for (let x = 540; x < 2300; x += 110) f += `<rect x="${x}" y="1300" width="12" height="110" rx="3"/>`;
  f += `<rect x="520" y="1318" width="1780" height="9" rx="4"/><rect x="520" y="1360" width="1780" height="9" rx="4"/>`;
  $('fence').innerHTML = f;
  let d = ''; for (let i = 0; i < 90; i++) d += `<circle cx="${260 + ((i*131) % 1560)}" cy="${1442 + ((i*47) % 104)}" r="${2 + (i % 3)}"/>`;
  $('soilDots').innerHTML = d;
  let s = ''; for (let i = 0; i < 9; i++) s += `<circle r="10"/>`; $('smoke').innerHTML = s;
  let c = ''; for (let i = 0; i < 18; i++) c += `<circle r="${4 + (i % 4)*2}"/>`; $('clods').innerHTML = c;
  // jungle chez Marc
  const weeds = (n, y0, y1, h0, h1, seed, cols) => { let s = '';
    for (let i = 0; i < n; i++){ const x = 30 + ((i*83 + seed*7) % 1030), y = y0 + ((i*41 + seed) % (y1 - y0)), h = h0 + ((i*61 + seed*3) % (h1 - h0)), lean = ((i*7 + seed) % 11) - 5;
      s += `<path d="M${x-6} ${y} Q${x+lean*2} ${y-h*.6} ${x+lean*7} ${y-h} Q${x+lean*2+4} ${y-h*.5} ${x+6} ${y}Z" fill="${cols[i % cols.length]}"/>`;
      if (i % 4 === 0) s += `<circle cx="${x+lean*7}" cy="${y-h-6}" r="${6 + (i % 3)*2}" fill="#6b6a48"/>`; }
    return s; };
  $('weedsBack').innerHTML = weeds(110, 1236, 1300, 80, 230, 11, ['#24402e','#2c4d36','#335a3e','#1f3828','#3a5a34']);
  $('weedsFront').innerHTML = weeds(120, 1330, 1430, 140, 300, 5, ['#2c4d36','#335a3e','#3d6844','#24402e','#46703f']);
  let b = '';
  [[40,1400,340,1300],[700,1420,1050,1330],[300,1430,560,1360]].forEach(([x0,y0,x1,y1]) => {
    const mx = (x0+x1)/2, my = Math.min(y0,y1) - 140;
    b += `<path d="M${x0} ${y0} Q${mx} ${my} ${x1} ${y1}"/>`;
    for (let i = 1; i < 9; i++){ const t = i/9, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*mx + t*t*x1, y = (1-t)*(1-t)*y0 + 2*(1-t)*t*my + t*t*y1;
      b += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} l${(i%2?-10:10)} -12" stroke-width="4"/>`; }
  });
  $('brambles').innerHTML = b;
  // terrasse du concurrent
  let pv = ''; for (let x = 70; x < 1010; x += 62) pv += `<rect x="${x}" y="${RG - 26}" width="58" height="12"/>`;
  $('pavers').innerHTML = pv;
  let gv = ''; for (let i = 0; i < 70; i++) gv += `<circle cx="${70 + ((i*97) % 940)}" cy="${RG - 8 + ((i*29) % 26)}" r="${2 + (i % 3)}"/>`;
  $('gravel').innerHTML = gv;
  let dust = ''; for (let i = 0; i < 10; i++) dust += `<circle r="8"/>`; $('rDust').innerHTML = dust;
  // grilles
  let g = ''; for (let x=0;x<=1080;x+=90) g += `<line x1="${x}" y1="0" x2="${x}" y2="1920"/>`; for (let y=0;y<=1920;y+=90) g += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
  $('punchGrid').innerHTML = g;
})();

/* ============ OUTILS ============ */
function ik(hx, hy, fx, fy, a, b, pick){
  const dx = fx-hx, dy = fy-hy, d = Math.hypot(dx,dy);
  const dc = clamp(d, 1, a+b-1), th = Math.atan2(dy,dx);
  const al = Math.acos(clamp((a*a + dc*dc - b*b)/(2*a*dc), -1, 1));
  const k1 = [hx + a*Math.cos(th-al), hy + a*Math.sin(th-al)], k2 = [hx + a*Math.cos(th+al), hy + a*Math.sin(th+al)];
  return { knee: pick(k1, k2), ankle: [hx + dc*Math.cos(th), hy + dc*Math.sin(th)] };
}
const forward = (k1, k2) => k1[0] > k2[0] ? k1 : k2;
const below = (k1, k2) => k1[1] > k2[1] ? k1 : k2;
const rad = a => a*Math.PI/180;
const dir = a => [Math.cos(rad(a)), Math.sin(rad(a))];
const add = (p, v, k = 1) => [p[0] + v[0]*k, p[1] + v[1]*k];
const perp = v => [-v[1], v[0]];
const P = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
function beam(p, q, w1, w2){
  const v = [q[0]-p[0], q[1]-p[1]], L = Math.hypot(v[0], v[1]), u = [v[0]/L, v[1]/L], n = perp(u);
  const a = add(p, n, -w1/2), b = add(q, n, -w2/2), c = add(q, n, w2/2), d = add(p, n, w1/2);
  return `M${P(a)} L${P(b)} Q${P(add(q, u, w2*.8))} ${P(c)} L${P(d)} Q${P(add(p, u, -w1*.9))} ${P(a)}Z`;
}

/* ============ LA MINI-PELLE ============ */
// angles absolus (0 = vers la droite, positif = vers le bas) : flèche, balancier, godet
const DIG = [
  {t:0.0, a:[-28, 62, 100]},
  {t:1.1, a:[-12, 96, 150]},
  {t:1.8, a:[-13, 104, 228]},
  {t:2.7, a:[-40, 22, 200]},
  {t:3.2, a:[-40, 22, 60]},
  {t:4.0, a:[-28, 62, 100]},
];
const REST = [-8, 82, 150];
const BOOM_PIVOT = [150, -175], L1 = 330, L2 = 250;
function digAngles(t){
  const c = ((t % 4) + 4) % 4;
  for (let i = 0; i < DIG.length - 1; i++){
    const k0 = DIG[i], k1 = DIG[i+1];
    if (c <= k1.t){ const e = smooth((c - k0.t)/(k1.t - k0.t));
      return {a: k0.a.map((v, j) => lerp(v, k1.a[j], e)), load: c > 1.75 && c < 3.05 ? 1 : 0, phase: c}; }
  }
  return {a: DIG[0].a, load:0, phase:c};
}
// mode : 'work' (il creuse), 'look' (il regarde son téléphone), 'call' (il rappelle)
function renderExc(t, mode, k = 0){
  const working = mode === 'work';
  const jx = working ? Math.sin(t*71)*1.1 : 0, jy = working ? Math.sin(t*53)*1.4 : 0;
  A('exc', {transform:`translate(${(EX + jx).toFixed(1)} ${(GROUND + jy).toFixed(1)})`});
  const st = working ? digAngles(t) : {a: REST, load: 0, phase: 0};
  const [a1, a2, a3] = st.a;
  const p0 = BOOM_PIVOT, d1 = dir(a1), p1 = add(p0, d1, L1), d2 = dir(a2), p2 = add(p1, d2, L2);
  A('boom', {d: beam(add(p0, d1, -20), p1, 52, 36)});
  A('stick', {d: beam(add(p1, d2, -62), p2, 34, 26)});
  A('pinP1', {cx: p1[0], cy: p1[1]});
  A('bucket', {transform:`translate(${P(p2)}) rotate(${a3.toFixed(1)})`});
  A('load', {opacity: st.load});
  // vérins
  const cb0 = [112, -132], cb1 = add(add(p0, d1, L1*.5), perp(d1), 28);
  const mb = add(cb0, [cb1[0]-cb0[0], cb1[1]-cb0[1]], .55);
  A('cylBoom', {d:`M${P(cb0)} L${P(mb)}`}); A('rodBoom', {d:`M${P(mb)} L${P(cb1)}`});
  const cs0 = add(add(p0, d1, L1*.62), perp(d1), -26), cs1 = add(p1, d2, -62);
  const ms = add(cs0, [cs1[0]-cs0[0], cs1[1]-cs0[1]], .55);
  A('cylStick', {d:`M${P(cs0)} L${P(ms)}`}); A('rodStick', {d:`M${P(ms)} L${P(cs1)}`});
  // conducteur
  const sh = [-34, -292];
  let hand;
  if (mode === 'work') hand = [48 + 3*Math.sin(t*2.3), -236 + 3*Math.cos(t*1.7)];
  else if (mode === 'look') hand = [lerp(48, 18, smooth(k)), lerp(-236, -306, smooth(k))];
  else hand = [lerp(18, -14, smooth(k)), lerp(-306, -344, smooth(k))];
  const r = ik(sh[0], sh[1], hand[0], hand[1], 70, 66, below);
  A('opArm', {d:`M${P(sh)} L${P(r.knee)} L${P(r.ankle)}`});
  A('opHand', {cx: hand[0], cy: hand[1]});
  A('joy', {d: mode === 'work' ? `M40 -196 L${P(hand)}` : 'M40 -196 L46 -232'});
  // fumée + bruit + terre
  const ex = [-194 + EX + jx, -310 + GROUND + jy];
  [...$('smoke').children].forEach((p, i) => {
    const kk = ((t*.9 + i/9) % 1), on = working ? 1 : .25;
    A(p, {cx:(ex[0] - kk*90 + Math.sin(t*2 + i)*8).toFixed(1), cy:(ex[1] - kk*220).toFixed(1), r:(8 + kk*30).toFixed(1), opacity:((1-kk)*.32*on).toFixed(2)});
  });
  [...$('noise').children].forEach((p, i) => {

}
function pointAt(id, frac){ const el = $(id), L = wireCache[id].len; const p = el.getPointAtLength(clamp(frac,0,1)*L); return [p.x, p.y]; }

function drawWire(id, a, b, color, show, z){
  const el = $(id), L = wireCache[id] ? wireCache[id].len : 0;

    A(el, {opacity:0}); A(id + 'Head', {opacity:0});

  NODES.forEach((fr, i) => {
    const on = fr > a && fr < b, p = pointAt(id, fr);
    A(nodes[i], {cx:p[0], cy:p[1], r:(5.5/z).toFixed(1), fill:color, opacity: on ? (show*.9).toFixed(2) : 0});
  });
}
function drawLine(id, d, a, b, color, show = 1){
  const el = $(id);

  A('kStamp', {opacity:st.toFixed(2), transform:`translate(${shake(2.9, 12)} 0) translate(540 880) rotate(${lerp(-14, -5, easeOut(st)).toFixed(1)}) scale(${lerp(2.4, 1, easeOut(st)).toFixed(3)}) translate(-540 -880)`});
  A('kLogo', {opacity: easeOut(win(t, 3.25, 3.5)).toFixed(2)});
  A('kGlow', {opacity:(.03 + .09*Math.max(0, 1 - Math.abs(t - .9)/.35, 1 - Math.abs(t - 2.9)/.35)).toFixed(3)});
}

/* ============ MONTAGE ============ */
const DUR = 46.3;
const DIPS = [];

function render(TT){
  const inWorld = true, story = TT < 38.9;
  A('world', {opacity: inWorld ? 1 : 0}); A('ui', {opacity: story ? 1 : 0});
  ['S_punch','S_cta'].forEach(id => A(id, {opacity:0}));
  A('lineA', {opacity:0}); A('lineAHead', {opacity:0});

  if (inWorld){
    // --- les personnages
    const noon = TT >= 33.3;
    const exMode = !noon ? 'work' : TT < 34.95 ? 'look' : 'call';
    const exK = exMode === 'look' ? win(TT, 33.9, 34.4) : exMode === 'call' ? win(TT, 34.95, 35.35) : 0;
    const ex = renderExc(TT >= 23.1 ? TT - 7.1 : TT, exMode, exK);   // passage 16.0-23.1 coupé : la pelle continue sans à-coup
    const vib = TT < 5.4 || (TT > 12.2 && TT < 14.9);
    A('pGlow', {opacity: vib ? (.6 + .3*Math.sin(TT*12)).toFixed(2) : 0});
    A('haptic', {opacity: vib ? (.5 + .5*Math.sin(TT*14)).toFixed(2) : 0});
    A('opPocket', {opacity: noon && TT > 34.1 ? 0 : 1, transform:`translate(${vib ? (Math.sin(TT*90)*1.6).toFixed(2) : 0} 0)`});
    A('pScreen', {stroke: TT >= 14.9 ? RED : VIOLET});
    const ear = bump(TT, 12.9, 15.8, .3);
    A('earGlow', {opacity: (ear*(.5 + .25*Math.sin(TT*6))).toFixed(2)});
    A('muffsOn', {opacity: noon && TT > 33.8 ? 0 : 1}); A('muffsOff', {opacity: noon && TT > 33.8 ? 1 : 0});
    A('handPhone', {opacity: noon && TT > 34.1 ? 1 : 0, transform:`translate(${P(ex.hand)})`});
    A('hpGlow', {opacity: exMode === 'look' ? (.5 + .3*Math.sin(TT*8)).toFixed(2) : .2});
    const rv = renderRival(TT - 28.4, TT > 30.9);
    renderMarc(TT);
    const pop = easeOut(win(TT, 7.45, 7.85));
    A('S_phone', {opacity: pop.toFixed(2), transform:`translate(-159.2 -1541.6) scale(${(.62*(.9 + .1*pop)).toFixed(4)}) translate(-540 -720)`});
    renderPhone(TT);

    // --- fils
    wirePath('wA', curve(B_CALL, ex.pocket, [40, 700], [-220, -1000]));
    wirePath('wB', curve(B_SEND, rv.pocket, [520, 260], [-760, 520]));
    wirePath('wC', curve(ex.handW, B_CALL, [-80, -1000], [40, 700]));
    ['wA','wB','wC'].forEach(id => drawWire(id, 0, 0, VIOLET, 0, 1));
    const wires = [];
    const panelCam = mixCam(mixCam(MARC_CAM, PANEL_CAM, smooth(win(TT, 7.6, 8.2))), RES_CAM, bump(TT, 8.9, 11.6, .4));
    let cam;

    if (TT < 5.3){
      // 1. accroche : il creuse, son téléphone vibre dans sa poche, il ne l'entend pas
      cam = mixCam(HOOK_CAM, FULL_CAM, smooth(win(TT, 1.8, 4.0)));
      wires.push(['wA', 0, lerp(.55, 1, easeOut(win(TT, 0, .45))), VIOLET, 1]);
    } else if (TT < 6.5){
      // 2. on remonte le fil jusqu'à Marc
      const k = easeInOut(win(TT, 5.3, 6.3)), b = 1 - k, hp = pointAt('wA', b);
      cam = mixCam(mixCam(FULL_CAM, {cx: hp[0], cy: hp[1] + 120, z: .42}, smooth(win(TT, 5.3, 5.75))), MARC_CAM, smooth(win(TT, 5.95, 6.5)));
      wires.push(['wA', 0, b, VIOLET, .85]);
    } else if (TT < 11.35){
      // 3. Marc, son jardin à l'abandon, puis son téléphone
      cam = panelCam;
    } else if (TT < 12.95){
      // 4. il appelle : on suit le fil jusqu'à la poche du paysagiste
      const k = easeInOut(win(TT, 11.35, 12.75)), hp = pointAt('wA', k);
      cam = mixCam(mixCam(panelCam, {cx: hp[0], cy: hp[1] + 100, z: .45}, smooth(win(TT, 11.35, 11.8))), CAB_CAM, smooth(win(TT, 12.35, 12.95)));
      wires.push(['wA', 0, k, VIOLET, 1]);
    } else if (TT < 23.1){
      // 5. ça vibre sous le bruit de la machine… messagerie. Puis le problème.
      cam = mixCam(CAB_CAM, FULL_CAM, smooth(win(TT, 15.9, 17.0)));
      const red = win(TT, 14.9, 15.3);
      wires.push(['wA', 0, 1, red > .5 ? RED : VIOLET, (1 - .6*red)*(1 - win(TT, 15.7, 16.0))]);
    } else if (TT < 24.1){
      // 6. retour chez Marc : il essaie le concurrent
      cam = fly(CAB_CAM, PANEL_CAM, easeInOut(win(TT, 23.1, 24.1)));
    } else if (TT < 28.4){
      cam = mixCam(PANEL_CAM, SITE_CAM, smooth(win(TT, 25.0, 25.6)));
    } else if (TT < 29.9){
      // 7. la demande part, en vert : on la suit jusqu'au concurrent
      const k = easeInOut(win(TT, 28.4, 29.7)), hp = pointAt('wB', k);
      cam = mixCam(mixCam(SITE_CAM, {cx: hp[0], cy: hp[1] + 100, z: .48}, smooth(win(TT, 28.4, 28.85))), RIVAL_CAM, smooth(win(TT, 29.3, 29.9)));
      wires.push(['wB', 0, k, LIME, 1]);
    } else if (TT < 33.3){
      cam = {...RIVAL_CAM, z: RIVAL_CAM.z*(1 + .04*win(TT, 29.9, 33.3))};
      wires.push(['wB', 0, 1, LIME, 1]);
    } else if (TT < 34.3){
      // 8. midi : retour chez notre paysagiste
      cam = fly(RIVAL_CAM, NOON_CAM, easeInOut(win(TT, 33.3, 34.3)));
    } else if (TT < 35.6){
      cam = NOON_CAM;
    } else if (TT < 37.2){
      // 9. il rappelle : le fil remonte jusqu'à Marc
      const k = easeInOut(win(TT, 35.6, 37.0)), hp = pointAt('wC', k);
      cam = mixCam(mixCam(NOON_CAM, {cx: hp[0], cy: hp[1] + 100, z: .45}, smooth(win(TT, 35.6, 36.05))), PANEL_CAM, smooth(win(TT, 36.6, 37.2)));
      wires.push(['wC', 0, k, VIOLET, 1]);
    } else if (!story){
      // 11. phrase à retenir + appel à l'action : le chantier de Dumont, à l'arrêt, en fond
      cam = {...FULL_CAM, z: FULL_CAM.z*(1 + .05*win(TT, 38.9, DUR))};
    } else {
      // 10. Marc ne décroche pas : il a déjà sa visite
      // (fil raccourci : en gros plan, Chrome n'affiche plus la lueur d'un fil aussi long)
      cam = PANEL_CAM;
      wirePath('wC', curve(add(B_CALL, [20, 760]), B_CALL, [-10, -300], [30, 260]));
      const red = win(TT, 38.1, 38.35);
      wires.push(['wC', red*.8, 1, red > .3 ? RED : VIOLET, 1 - .4*red]);
    }

    A('world', {transform:`translate(540 860) scale(${cam.z.toFixed(4)}) translate(${(-cam.cx).toFixed(1)} ${(-cam.cy).toFixed(1)})`});
    wires.forEach(w => drawWire(w[0], w[1], w[2], w[3], w[4], cam.z));
    const S = w => [540 + (w[0]-cam.cx)*cam.z, 860 + (w[1]-cam.cy)*cam.z];
    const onSite = TT < 5.3 || (TT > 12.6 && TT < 23.1);

    // pastilles
    const sp = S(ex.pocket), sh = S(ex.head), sj = S(ex.joyW);
    const inA = Math.max(win(TT, .45, .75)*(1 - win(TT, 5.0, 5.3)), win(TT, 12.75, 13.05)*(1 - win(TT, 14.75, 14.95)));
    $('pillInSub').textContent = TT > 10 ? 'Marc · nouveau client' : 'Numéro inconnu';
    const pinPos = [60, 440];   // au-dessus de la cabine, sans cacher le conducteur
    A('pillIn', {opacity:inA.toFixed(2), transform:`translate(${pinPos[0].toFixed(1)} ${(pinPos[1] + (1-easeOut(inA))*16).toFixed(1)})`});
    const missA = win(TT, 14.9, 15.15)*(1 - win(TT, 15.7, 16.0));
    const noonMiss = win(TT, 34.4, 34.65)*(1 - win(TT, 35.0, 35.2));
    const sHand = S(ex.handW);
    if (noonMiss > 0){
      $('pillMissT').textContent = '1 appel manqué · Marc'; A('pillMissBox', {width:380});
      A('pillMiss', {opacity:noonMiss.toFixed(2), transform:`translate(${clamp(sHand[0] - 190, 30, 670).toFixed(1)} ${(sHand[1] - 230).toFixed(1)})`});
    } else {
      $('pillMissT').textContent = 'Appel manqué'; A('pillMissBox', {width:300});
      A('pillMiss', {opacity:missA.toFixed(2), transform:`translate(${pinPos[0].toFixed(1)} ${pinPos[1].toFixed(1)}) scale(${(.85 + .15*smooth(missA)).toFixed(3)})`});
    }
    A('pillEar', {opacity:(onSite ? ear : 0).toFixed(2), transform:`translate(${clamp(sh[0] + 70, 30, 740).toFixed(1)} ${(sh[1] - 150).toFixed(1)})`});
    const hands = 0;
    A('pillHands', {opacity:(onSite ? hands : 0).toFixed(2), transform:`translate(${clamp(sj[0] + 40, 30, 740).toFixed(1)} ${(sj[1] + 20).toFixed(1)})`});
    const gA = bump(TT, 6.6, 9.0, .3);
    const gp = S([-1450 + 300, -2200 + 260]);
    A('pillGarden', {opacity: gA.toFixed(2), transform:`translate(${gp[0].toFixed(1)} ${(gp[1] + (1-easeOut(gA))*14).toFixed(1)})`});
    // midi : il rappelle
    const callA = win(TT, 35.1, 35.35)*(1 - win(TT, 35.75, 35.95));
    A('pillCall', {opacity: callA.toFixed(2), transform:`translate(${clamp(sHand[0] + 50, 30, 720).toFixed(1)} ${(sHand[1] - 200).toFixed(1)})`});
    A('callDot', {opacity:(.4 + .6*Math.abs(Math.sin(TT*4))).toFixed(2)});
    // le concurrent est prévenu, son site a répondu
    const rp = S(rv.pocket);
    const nA = win(TT, 30.9, 31.2)*(1 - win(TT, 33.1, 33.3));
    A('cardNew', {opacity:nA.toFixed(2), transform:`translate(${clamp(rp[0] - 520, 30, 580).toFixed(1)} ${(rp[1] - 470 + (1-easeOut(nA))*24).toFixed(1)})`});
    const aA = win(TT, 31.5, 31.8)*(1 - win(TT, 33.1, 33.3));
    A('cardAuto', {opacity:aA.toFixed(2), transform:`translate(${clamp(rp[0] - 520, 30, 580).toFixed(1)} ${(rp[1] - 320 + (1-easeOut(aA))*24).toFixed(1)})`});

    // accroche : 12 000 CHF, barré
    const amtOut = win(TT, 4.9, 5.3);
    A('hookAmt', {opacity:(1 - amtOut).toFixed(2), transform:`translate(0 ${(-amtOut*30).toFixed(1)})`});
    const strike = easeOut(win(TT, .8, 1.15));
    A('amtStrike', {width:(900*strike).toFixed(1)});
    const hit = Math.max(0, 1 - Math.abs(TT - 1.15)/.25);
    A('amtText', {fill: strike > .5 ? '#ffd6da' : '#ffffff', transform:`translate(540 340) scale(${(1 + .05*hit).toFixed(3)}) translate(-540 -340)`});
    // le problème
    const pc = 0;   // carte « SANS SITE » retirée (V9)
    A('probCard', {opacity:pc.toFixed(2), transform:`translate(540 345) scale(${(.92 + .08*backOut(win(TT, 16.3, 16.7))).toFixed(3)}) translate(-540 -345)`});
    A('probRow', {opacity: win(TT, 16.9, 17.3).toFixed(2)});
  }
  if (TT >= 38.9 && TT < 42.1){ A('S_punch', {opacity:1}); renderPunch(TT - 38.9); }
  else if (TT >= 42.1){ A('S_cta', {opacity:1}); renderCta(TT - 42.1); }
  let dip = 0; DIPS.forEach(d => dip = Math.max(dip, 1 - Math.abs(TT - d.c)/d.h));
  A('fade', {opacity: Math.max(clamp(dip, 0, 1), win(TT, DUR - .4, DUR)).toFixed(2)});
  renderSubs(TT);
  $('grain').style.backgroundPosition = `${(TT*997)%240}px ${(TT*631)%240}px`;
}

/* ============ VITESSE PAR PASSAGE ============ */
// [début, fin, vitesse] en temps montage : > 1 = on accélère ce passage
// Infinity = passage coupé (on saute directement à la suite)
// rythme : environ 40 s au total, fin plus rapide (vitesse < 1 = on ralentit le passage)
const SPEED = [[0,5.3,.88],[5.3,11.0,1.05],[11.0,16.0,.94],[16.0,23.1,Infinity],[23.1,28.4,.88],[28.4,33.3,.98],[33.3,38.9,1.04],[38.9,42.1,1.0],[42.1,DUR,1.05]];
const ANCHORS = [[0, 0]];
SPEED.forEach(([a, b, v]) => ANCHORS.push([b, ANCHORS[ANCHORS.length - 1][1] + (b - a)/v]));
const REAL_DUR = ANCHORS[ANCHORS.length - 1][1];
function designAt(r){
  for (let i = 0; i < ANCHORS.length - 1; i++){
    const [d0, r0] = ANCHORS[i], [d1, r1] = ANCHORS[i + 1];
    if (r1 > r0 && r <= r1) return d0 + (r - r0)*(d1 - d0)/(r1 - r0);
  }
  return DUR;
}

/* ============ LECTURE ============ */
const q = new URLSearchParams(location.search);
const STILL = q.get('t');
let t0 = performance.now(), paused = false, pauseAt = 0;
function loop(now){
  if (!paused){ const T = ((now - t0)/1000) % (REAL_DUR + 1); render(designAt(Math.min(T, REAL_DUR))); }
  requestAnimationFrame(loop);
}
if (STILL !== null){ render(+STILL); $('hint').remove(); }
else requestAnimationFrame(loop);
window.renderAt = r => render(designAt(r)); window.renderDesign = render; window.DUR = REAL_DUR;
stage.addEventListener('click', () => { paused = !paused; if (paused) pauseAt = performance.now(); else t0 += performance.now() - pauseAt; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r'){ t0 = performance.now(); paused = false; }
  if (k === 'arrowright') t0 -= 2000;
  if (k === 'arrowleft') t0 += 2000;
});
</script>
