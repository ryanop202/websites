<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wibzo Déménageur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --violet:#8b7bff; --lime:#c6ff3d; --red:#ff6b78; --text:#ecebf5; --muted:#8a8ca3; }
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #stage{width:1080px;height:1920px;position:relative;background:#11121b;overflow:hidden;transform-origin:center center;flex:none}
  svg{position:absolute;inset:0;width:100%;height:100%}
  svg text{font-family:Inter,system-ui,sans-serif}
  #grain{position:absolute;inset:-50px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
  #subs{position:absolute;left:70px;right:70px;top:1440px;text-align:center;color:#fff;font-size:56px;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,0,0,.7)}
  #subs span{display:inline-block;margin:0 .13em}
  #subs .v{color:var(--violet)} #subs .r{color:var(--red)} #subs .l{color:var(--lime)}
  #tag{position:absolute;top:120px;left:0;right:0;text-align:center;color:#9a9cb3;font-size:24px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#6b6d82;font:13px Inter,sans-serif}
</style>
</head>
<body>

<script>
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, (innerHeight-26)/1920); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);
const A = (el, o) => { el = typeof el === 'string' ? $(el) : el; for (const k in o) el.setAttribute(k, o[k]); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);
const win = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const backOut = t => { const c=1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const VIOLET = '#8b7bff', LIME = '#c6ff3d';

/* ============ construction statique ============ */
const RUN = 150, RISE = 82, Y0 = 1500;
const stepY = k => Y0 - k*RISE;
const noseY = x => Y0 - (x/RUN)*RISE;
(function(){
  let d = `M${-6*RUN} ${stepY(-6)+RISE} `, tr = '';
  for (let k=-6; k<=18; k++){
    const x = k*RUN, y = stepY(k);
    d += `L${x} ${y+RISE} L${x} ${y} L${x+RUN} ${y} `;
    tr += `<rect x="${x-4}" y="${y-3}" width="${RUN+4}" height="10" rx="3" fill="#2c2f47"/><rect x="${x}" y="${y+7}" width="${RUN}" height="10" fill="#0d0e16" opacity=".55"/>`;
  }
  A('stairs', {d: d + `L${19*RUN} 4000 L${-6*RUN} 4000Z`});
  $('treads').innerHTML = tr;
  const xa = -1200, xb = 3400;
  A('dadoLine', {d:`M${xa} ${noseY(xa)-330} L${xb} ${noseY(xb)-330}`});
  A('dadoPath', {d:`M${xa} ${noseY(xa)-330} L${xb} ${noseY(xb)-330} L${xb} 4000 L${xa} 4000Z`});
  A('rail', {d:`M${xa} ${noseY(xa)-250} L${xb} ${noseY(xb)-250}`});
  let br = ''; for (let x=-900; x<3200; x+=420) br += `<rect x="${x-6}" y="${noseY(x)-250}" width="12" height="34" rx="3"/>`;
  $('brackets').innerHTML = br;
  let dust = ''; for (let i=0;i<34;i++) dust += `<circle r="${(1.5+((i*7)%5)*.6).toFixed(1)}"/>`;
  $('dust').innerHTML = dust;
  // calendrier
  let g = ''; let day = 1;
  for (let r=0;r<5;r++) for (let c=0;c<7;c++){ if (day>30) break; const x = 22 + c*26, y = 76 + r*28;
    g += `<text x="${x}" y="${y}">${day}</text>`; if (day===15) A('cal15', {cx:x, cy:y-6}); day++; }
  $('calGrid').innerHTML = g;
  // chips pièces
  let ch = ''; ['1','2','3','4+'].forEach((l,i) => { const x = 290 + i*128;
    ch += `<rect id="room${i}" class="chip" x="${x}" y="502" width="116" height="70" rx="18"/><text id="room${i}t" class="ct" x="${x+58}" y="547" text-anchor="middle" font-size="27" font-weight="600">${l}</text>`; });
  $('chipsRooms').innerHTML = ch;
  // onde messagerie
  let w = ''; for (let i=0;i<16;i++) w += `<rect x="${412 + i*16}" y="860" width="8" height="10" rx="4"/>`;
  $('vmWave').innerHTML = w;
  // grille offre
  let og = ''; for (let x=0;x<=1080;x+=90) og += `<line x1="${x}" y1="0" x2="${x}" y2="1920"/>`; for (let y=0;y<=1920;y+=90) og += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
  $('offerGrid').innerHTML = og;
  // cartes offre
  const cards = [
    {icon:'eye',  t:'Ta maquette', s:'Gratuite, faite pour ton entreprise'},
    {icon:'clock',t:'Prête en 24 h', s:'Tu la vois avant de décider'},
    {icon:'check',t:'Elle te plaît ?', s:'On la met en ligne. Sinon, tu ne paies rien.'},
  ];
  let oc = '';
  cards.forEach((c,i) => {
    const y = 430 + i*250;
    const ic = c.icon==='eye' ? `<path d="M-20 0 Q0 -20 20 0 Q0 20 -20 0Z" fill="none" stroke="#11121b" stroke-width="5"/><circle r="6" fill="#11121b"/>`
             : c.icon==='clock' ? `<circle r="15" fill="none" stroke="#11121b" stroke-width="5"/><path d="M0 -8 V0 L7 5" stroke="#11121b" stroke-width="5" fill="none" stroke-linecap="round"/>`
             : `<path d="M-11 0 L-3 8 L12 -8" stroke="#11121b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    oc += `<g id="oc${i}" opacity="0" filter="url(#cardShadow)"><rect x="110" y="${y}" width="860" height="200" rx="34" fill="#171a20" stroke="#2a2e38" stroke-width="2"/>
      <g transform="translate(200 ${y+100})"><circle r="44" fill="#c6ff3d"/>${ic}</g>
      <text x="280" y="${y+92}" fill="#f0efea" font-size="46" font-weight="900">${c.t}</text>
      <text x="280" y="${y+140}" fill="#9a9ca6" font-size="27" font-weight="500">${c.s}</text></g>`;
  });
  $('offerCards').innerHTML = oc;
  // notifications nuit
  const times = ['23:47','02:14','06:05'];
  let nt = '';
  times.forEach((h,i) => { const y = 380 + i*170;
    nt += `<g id="nt${i}" opacity="0" filter="url(#cardShadow)"><rect x="70" y="${y}" width="520" height="140" rx="30" fill="#161a12" stroke="#c6ff3d" stroke-opacity=".7" stroke-width="2.5"/>
      <use href="#checkIcon" x="126" y="${y+70}" color="#c6ff3d"/>
      <text x="170" y="${y+62}" fill="#ecebf5" font-size="30" font-weight="800">Nouvelle demande</text>
      <text x="170" y="${y+104}" fill="#a5a8b8" font-size="23" font-weight="500">${h} · demande de devis</text></g>`; });
  $('notifs').innerHTML = nt;
})();

/* ============ ESCALIER ============ */
function ik(hx, hy, fx, fy, a, b){
  const dx = fx-hx, dy = fy-hy, d = Math.hypot(dx,dy);
  const dc = clamp(d, 1, a+b-1), th = Math.atan2(dy,dx);
  const al = Math.acos(clamp((a*a + dc*dc - b*b)/(2*a*dc), -1, 1));
  const k1 = [hx + a*Math.cos(th-al), hy + a*Math.sin(th-al)], k2 = [hx + a*Math.cos(th+al), hy + a*Math.sin(th+al)];
  return { knee: k1[0] > k2[0] ? k1 : k2, ankle: [hx + dc*Math.cos(th), hy + dc*Math.sin(th)] };
}
const foot = k => [k*RUN + 80, stepY(k)];
function pose(t, mode){
  if (mode === 'call'){ const p = 6; return {p, n:6, f:0, hip:[p*RUN+15, stepY(p)-176], lean:3}; }
  const p = 3 + 0.45*t, n = Math.floor(p), f = p - n;
  return {p, n, f, hip:[p*RUN + 15, stepY(p) - 172 - 7*Math.sin(Math.PI*f)], lean: 10 + 1.5*Math.sin(2*Math.PI*f)};
}
const toWorld = (P, x, y) => { const r = P.lean*Math.PI/180, c = Math.cos(r), s = Math.sin(r); return [P.hip[0] + x*c - y*s, P.hip[1] + x*s + y*c]; };

// mode : 'open' (appel manqué), 'call' (il rappelle), 'imagine' (la demande arrive chez lui)
// Pose le déménageur et renvoie la caméra qui le suit (sans l'appliquer).
function renderStairs(t, mode, opt = {}){
  const P = pose(t, mode === 'call' ? 'call' : 'climb');
  const {n, f, hip} = P;
  const e = mode === 'call' ? 0 : smooth(win(f, .2, .85));
  const planted = foot(n), from = foot(n-1), to = foot(n+1);
  const moving = [lerp(from[0], to[0], e), lerp(from[1], to[1], e) - 40*Math.sin(Math.PI*e)];
  const nearPlanted = n % 2 === 0;
  const fNear = nearPlanted ? planted : moving, fFar = nearPlanted ? moving : planted;
  const leg = (id, shoe, fp) => {
    const r = ik(hip[0], hip[1], fp[0], fp[1]-26, 135, 135);
    A(id, {d:`M${hip[0]} ${hip[1]} L${r.knee[0]} ${r.knee[1]} L${r.ankle[0]} ${r.ankle[1]}`});
    A(shoe, {transform:`translate(${r.ankle[0]-8} ${r.ankle[1]+26}) rotate(${fp === moving ? -6*Math.sin(Math.PI*e) : 0})`});
  };
  leg('legFar','shoeFar',fFar); leg('legNear','shoeNear',fNear);
  A('torso', {transform:`translate(${hip[0]} ${hip[1]}) rotate(${P.lean})`});
  A('shadow', {cx:(fNear[0]+fFar[0])/2 + 10, cy: Math.max(fNear[1], fFar[1]) - 2});

  const W = (x,y) => toWorld(P, x, y);
  if (mode === 'call'){
    A('sofaOn', {opacity:0});
    const cx = 1290; A('sofaDown', {opacity:1, transform:`translate(${cx} ${noseY(cx)-70}) rotate(-29)`});
    A('armFar', {d:'M-6 -198 Q-30 -130 -20 -74'}); A('gloveFar', {cx:-20, cy:-70});
    const sh = W(14,-196), el = W(64,-176), ha = W(16,-250);
    A('armNear', {d:`M${sh[0]} ${sh[1]} L${el[0]} ${el[1]} L${ha[0]} ${ha[1]}`});
    A('gloveNear', {cx:ha[0], cy:ha[1]});
    A('earPhone', {opacity:1, transform:`translate(${ha[0]+4} ${ha[1]-4}) rotate(14)`});
    A('phone', {opacity:0});
  } else {
    A('sofaOn', {opacity:1}); A('sofaDown', {opacity:0}); A('earPhone', {opacity:0}); A('phone', {opacity:1});
    A('armFar', {d:'M-6 -198 Q-58 -196 -78 -232 Q-90 -262 -96 -282'}); A('gloveFar', {cx:-96, cy:-286});
    const sh = W(14,-196), el = W(62,-160), ha = W(66,-246);
    A('armNear', {d:`M${sh[0]} ${sh[1]} L${el[0]} ${el[1]} L${ha[0]} ${ha[1]}`});
    A('gloveNear', {cx:ha[0], cy:ha[1]});
  }

  const ph = W(-44, 6), ep = W(16,-250);
  const isOpen = mode === 'open', isImg = mode === 'imagine';
  const vib = isOpen ? (t > .25 && t < 4.6) : isImg ? (opt.arrive !== undefined && opt.arrive > 0 && opt.arrive < 1.6) : false;
  A('phone', {transform:`translate(${vib ? Math.sin(t*90)*2.2 : 0} 0)`});
  A('pGlow', {fill: isImg ? 'url(#glowL)' : 'url(#glowV)'});
  A('pScreen', {stroke: isImg && opt.arrive > 0 ? LIME : VIOLET});
  let g = 0;
  if (isOpen) g = vib ? .55 + .35*Math.sin(t*12) : Math.max(0, .55*(1 - (t-4.6)/.4));
  if (isImg && opt.arrive > 0) g = .5 + .35*Math.sin(t*10);
  A('pGlow', {opacity: clamp(g,0,1).toFixed(2)});
  A('haptic', {opacity: vib ? (.5 + .5*Math.sin(t*14)).toFixed(2) : 0, stroke: isImg ? LIME : '#a99dff'});
  A('earGlow', {opacity: mode === 'call' ? (.35 + .3*Math.sin(t*8)).toFixed(2) : 0});

  // poussière
  const dust = $('dust').children;
  for (let i=0;i<dust.length;i++){
    const sx = 330 + ((i*97) % 460), base = 520 + ((i*173) % 820);
    A(dust[i], {cx:(sx + 10*Math.sin(t*.8 + i)).toFixed(1), cy:(base - ((t*14 + i*23) % 120)).toFixed(1), opacity:(.15 + .35*Math.abs(Math.sin(t*.9 + i*1.7))).toFixed(2)});
  }
  // caméra qui le suit
  let cam;
  if (isOpen){
    // gros plan sur la poche, puis on recule ; ensuite la caméra s'arrête et il continue de monter
    const e2 = smooth(win(t, 1.9, 4.3));
    const tf = t < 5.0 ? t : 5.0 + (1 - Math.exp(-(t-5.0)*1.2))*.7;
    const Q = pose(tf, 'climb'), nx = Q.hip[0] + 40, ny = Q.hip[1] - 150;
    cam = {cx: lerp(ph[0], nx, e2), cy: lerp(ph[1] + 40, ny, e2), z: lerp(2.4, 1.0, e2) * (1 + .05*smooth(win(t, 4.3, 8.4)))};
  } else if (mode === 'call'){
    cam = {cx: hip[0] + 60, cy: hip[1] - 150, z: 1};
  } else {
    cam = {cx: hip[0] + 40, cy: hip[1] - 150, z: 1.0 + 0.06*smooth(clamp(t/6.4,0,1))};
  }
  return {cam, ph, ep, t, mode, opt};
}

// pastilles à l'écran autour du déménageur (une fois la caméra connue)
function stairsPills(st, S, z){
  const {t, mode, opt} = st, isOpen = mode === 'open', isImg = mode === 'imagine';
  const vis = z > .6 ? 1 : 0;
  const sp = S(st.ph);
  const inA = isOpen ? win(t,.5,.8) * (1 - win(t,4.4,4.6)) : 0;
  A('pillIn', {opacity:(inA*vis).toFixed(2), transform:`translate(${sp[0]-430} ${sp[1]-150 + (1-win(t,.5,.8))*16})`});
  const rp = S(toWorld(pose(4.6,'climb'), -44, 6));
  const missA = isOpen ? win(t, 4.6, 4.9) : 0;
  A('pillMiss', {opacity:(missA*vis).toFixed(2), transform:`translate(${rp[0]-380} ${rp[1]-40}) scale(${(.85 + .15*smooth(missA)).toFixed(3)})`});
  const callA = mode === 'call' ? win(t, .5, .8) : 0;
  const se = S(st.ep);
  A('pillCall', {opacity:(callA*vis).toFixed(2), transform:`translate(${Math.min(se[0]+70, 700)} ${se[1]-170})`});
  A('callDot', {opacity: (.4 + .6*Math.abs(Math.sin(t*4))).toFixed(2)});
  $('callSub').textContent = t > 2.2 ? 'Pas de réponse' : 'Ça sonne…';
  A('callSub', {fill: t > 2.2 ? '#ff6b78' : '#8a8ca3'});
  const nA = isImg && opt.arrive !== undefined ? win(opt.arrive, .15, .45) : 0;
  A('cardNew', {opacity:(nA*vis).toFixed(2), transform:`translate(${Math.max(40, sp[0]-470)} ${sp[1]-300 + (1-easeOut(nA))*24})`});
}

/* ============ BUREAU ============ */
function renderOffice(t){
  const push = 1 + .08*smooth(win(t, 0, 3.6));
  const zin = smooth(win(t, 3.3, 4.5));
  const s = push * (1 + .7*zin*zin);
  const ox = 540, oy = 1055;           // le téléphone
  A('envelope', {opacity: win(t,.4,.8).toFixed(2), transform:`translate(0 ${(1-easeOut(win(t,.4,.8)))*-20})`});
  A('bailCheck', {opacity: win(t,1.0,1.2).toFixed(2), transform:`translate(${190*(1)} ${-14}) scale(${backOut(win(t,1.0,1.35)).toFixed(3)}) translate(-190 14)`});
  A('julieHead', {transform:`rotate(${(2*Math.sin(t*1.3)).toFixed(2)} 540 870)`});
  A('steam', {opacity: (.5 + .5*Math.sin(t*2)).toFixed(2), transform:`translate(0 ${-(t*10)%14})`});
  A('julPhone', {stroke: t > 2.8 && t < 3.4 ? '#8b7bff' : '#3a3d58'});
}

/* ============ TÉLÉPHONE ============ */
function chip(id, on, accentFill, base){
  const el = $(id), tx = $(id+'t');
  A(el, {fill: on ? accentFill : base.chip, stroke: on ? accentFill : base.chipStroke, 'stroke-width':2});
  if (tx) A(tx, {fill: on ? base.onText : base.text});
}
function setSiteTheme(brand){
  const dark = brand === 'martin';
  const th = dark ? {bg:'#121512', head:'#181c17', text:'#f0efea', lab:'#9a9ca6', chip:'#1e231d', chipStroke:'#2e352c', onText:'#11121b', accent:LIME, btnText:'#11121b'}
                  : {bg:'#f4f3fa', head:'#ffffff', text:'#1b1a2b', lab:'#6b6982', chip:'#ffffff', chipStroke:'#dcd9ea', onText:'#ffffff', accent:'#6d5df5', btnText:'#ffffff'};
  A('siteBg', {fill:th.bg}); A('siteHead', {fill:th.head}); A('sentBg', {fill:th.bg});
  A('siteLogo', {fill:th.accent});
  $('siteName').textContent = dark ? 'Martin Déménagements' : 'Express Déménagement';
  ['siteName','siteH1','siteH2','sentT1'].forEach(i => A(i, {fill:th.text}));
  document.querySelectorAll('#siteUI .lab').forEach(e => A(e, {fill:th.lab}));
  A('sentT2', {fill:th.lab}); A('sentCircle', {fill:th.accent}); A('sentTick', {stroke: dark ? '#11121b' : '#fff'});
  A('btnQuote', {fill:th.accent}); A('btnQuotet', {fill:th.btnText});
  return th;
}
function tap(t, t0, x, y){
  // doigt qui arrive (t0-.45 -> t0), appuie à t0
  const a = win(t, t0-.5, t0-.05), r = win(t, t0, t0+.45);
  return {a, x, y, press: t >= t0 && t < t0+.12, ripple: r};
}
function renderPhone(t, script, extraY = 0){
  // script : liste de vues -> état
  const st = script(t);
  A('typeRect', {width: st.typed*440});
  A('caret', {x: 362 + st.typed*318, opacity: st.caret ? (Math.sin(t*9) > 0 ? 1 : 0) : 0});
  A('res1', {opacity:st.res1.toFixed(2), transform:`translate(0 ${(1-easeOut(st.res1))*30})`});
  A('noSite', {transform:`translate(438 546) scale(${(1 + .07*st.pulse).toFixed(3)}) translate(-438 -546)`});
  A('res2', {opacity:st.res2.toFixed(2), transform:`translate(0 ${(1-easeOut(st.res2))*30})`});
  A('res2box', {'stroke-opacity': (.55 + .45*st.res2hl).toFixed(2)});
  A('results', {transform:`translate(0 ${st.scroll})`});
  A('callUI', {opacity:st.call.toFixed(2)});
  document.querySelectorAll('#callUI .ring').forEach((c,i) => {
    const ph = ((st.callT - i*.5) % 1.1 + 1.1) % 1.1, on = st.ringing && st.callT > i*.5;
    A(c, {r: 100 + ph*110, opacity: on ? (1-ph/1.1)*.8 : 0});
  });
  A('voicemail', {opacity:st.vm.toFixed(2)});
  [...$('vmWave').children].forEach((b,i) => { const h = 10 + 26*Math.abs(Math.sin(t*7 + i*.9)) * st.vm; A(b, {height:h.toFixed(1), y:(870 - h/2).toFixed(1)}); });
  $('callState').textContent = st.vm > .5 ? 'Appel terminé' : 'Appel en cours…';
  // site

const base = {typed:0, caret:false, res1:0, pulse:0, res2:0, res2hl:0, scroll:0, call:0, ringing:false, callT:0, vm:0, site:0, brand:'express', rooms:false, date:false, piano:false, btnPress:false, sent:0, incoming:0, finger:null};

// partie 1 : recherche -> appel -> messagerie -> site concurrent -> envoyé
function script1(t){

  s.call = win(t, 3.2, 3.45) * (1 - win(t, 5.6, 5.9));

  s.site = win(t, 7.1, 7.4);
  s.rooms = t > 7.9; s.date = t > 8.45; s.piano = t > 9.0;
  if (t > 7.3 && t < 8.0) s.finger = tap(t, 7.85, 546, 537);
  if (t > 8.0 && t < 8.55) s.finger = tap(t, 8.4, 540, 687);

}
// partie 2 : elle a envoyé, il rappelle, elle ignore
function script2(t){

// fils dans le décor (wA, wB, wC) : la caméra peut les suivre
const wireCache = {};
function wirePath(id, d){
  const el = $(id), c = wireCache[id] || (wireCache[id] = {d:'', len:0});
  if (d !== c.d){ A(el, {d}); c.d = d; c.len = el.getTotalLength(); }
  return c.len;
}
function pointAt(id, frac){ const el = $(id), L = wireCache[id].len; const p = el.getPointAtLength(clamp(frac,0,1)*L); return [p.x, p.y]; }
const NODES = [.14, .32, .5, .68, .86];
function drawWire(id, a, b, color, show, z){
  const el = $(id), L = wireCache[id] ? wireCache[id].len : 0;
  const nodes = $(id + 'Nodes').children;
  if (!L || b <= a || show <= 0){
    A(el, {opacity:0}); A(id + 'Head', {opacity:0});
    for (const nd of nodes) A(nd, {opacity:0});
    return;
  }
  A(el, {stroke:color, opacity:show.toFixed(2), 'stroke-dasharray':`${(L*(b-a)).toFixed(1)} ${(L*3).toFixed(1)}`, 'stroke-dashoffset': (-L*a).toFixed(1)});
  const hp = pointAt(id, b);
  A(id + 'Head', {cx:hp[0], cy:hp[1], r:(9/z).toFixed(1), fill: color === LIME ? '#f2ffd0' : '#ffffff', opacity: b < .999 ? show.toFixed(2) : 0});
  NODES.forEach((fr, i) => {
    const on = fr > a && fr < b, p = pointAt(id, fr);
    A(nodes[i], {cx:p[0], cy:p[1], r:(5.5/z).toFixed(1), fill:color, opacity: on ? (show*.9).toFixed(2) : 0});
  });
}
function hideWires(){ ['wA','wB','wC'].forEach(id => drawWire(id, 0, 0, VIOLET, 0, 1)); }

// fils à l'écran (nuit, logo)
const lineCache = {};
function drawLine(id, d, a, b, color, show = 1){
  const el = $(id), c = lineCache[id] || (lineCache[id] = {d:'', len:0});
  if (d !== c.d){ A(el, {d}); c.d = d; c.len = el.getTotalLength(); }
  const L = c.len;
  if (b <= a || show <= 0){ A(el, {opacity:0}); A(id + 'Head', {opacity:0}); return; }
  A(el, {stroke:color, opacity:show.toFixed(2), 'stroke-dasharray':`${(L*(b-a)).toFixed(1)} ${(L*3).toFixed(1)}`, 'stroke-dashoffset': (-L*a).toFixed(1)});
  const pt = el.getPointAtLength(L*b);
  A(id + 'Head', {cx:pt.x, cy:pt.y, fill: color === LIME ? '#efffc8' : '#ffffff', opacity: b < 1 ? show.toFixed(2) : 0});
}

/* ============ MONTAGE ============ */
const DUR = 58.6;
const DIPS = [{c:35.9, h:.18}, {c:41.3, h:.35}, {c:47.0, h:.3}, {c:54.6, h:.25}];
const B_CALL = PW(540, 1298), B_SEND = PW(848, 980), B_BANNER = PW(848, 300), B_SEND_DOWN = PW(540, 1298);
const curve = (p, q, d1, d2) => `M${p[0]} ${p[1]} C ${p[0]+d1[0]} ${p[1]+d1[1]}, ${q[0]+d2[0]} ${q[1]+d2[1]}, ${q[0]} ${q[1]}`;

function render(TT){
  const svgEl = $('stage').querySelector('svg');
  if (TT >= 32.0 && TT < 33.5){
    // on rembobine tout ce qu'on vient de voir, à toute vitesse
    const k = easeInOut(win(TT, 32.0, 33.5));
    render(31.9 - k*(31.9 - 4.3));
    A('rew', {opacity:1}); A('rewBg', {opacity:.28});
    $('rewText').textContent = 'MAINTENANT, IMAGINE'; A('rewText', {fill: LIME}); A('rewBigRing', {stroke: LIME});
    A('rewBigRing', {transform:`translate(540 880) scale(${(1 + .06*Math.sin(TT*30)).toFixed(3)}) translate(-540 -880)`});
    [...$('rewBars').children].forEach((b, i) => A(b, {y: ((TT*5200 + i*640) % 1920).toFixed(0)}));
    svgEl.style.transform = `translateX(${(Math.sin(TT*97)*5).toFixed(1)}px)`;
    A('fade', {opacity:0}); A('flash', {opacity:0}); A('rewMini', {opacity:0});
    renderSubs(TT);
    return;
  }
  svgEl.style.transform = '';
  A('rew', {opacity:0});
  A('flash', {opacity: (TT >= 33.5 && TT < 33.9 ? .55*(1 - win(TT, 33.5, 33.9)) : 0).toFixed(2)});
  hideLines(); hideWires();
  const inWorld = TT < 41.3;
  A('world', {opacity: inWorld ? 1 : 0});
  ['S_night','S_offer','S_logo'].forEach(id => A(id, {opacity:0}));
  A('rewMini', {opacity:0});
  let cam = OFFICE_CAM;

  if (inWorld){
    // --- le déménageur
    let st;
    if (TT < 26.0)      st = renderStairs(Math.min(TT, 10.4), 'open');
    else if (TT < 32.0) st = renderStairs(TT - 26.0, 'call');
    else                st = renderStairs(TT - 33.5 + 4.3, 'imagine', {arrive: TT - 38.5});
    // --- Julie, son téléphone, le concurrent
    renderOffice(TT - 10.4);
    const pop = easeOut(win(TT, 12.2, 12.7));
    A('S_phone', {opacity: pop.toFixed(2), transform:`translate(-159.2 -1541.6) scale(${(.62*(.9 + .1*pop)).toFixed(4)}) translate(-540 -720)`});
    if (TT < 26.0)      renderPhone(TT - 12.6, script1);
    else if (TT < 32.0) renderPhone(Math.max(0, TT - 28.8), script2);
    else if (TT < 35.9) renderPhone(0, script3);
    else                renderPhone(TT - 35.9, script3);
    renderDepot(TT < 32.3 ? TT - 23.35 : 0);

    // --- fils
    const pk = st.ph;
    wirePath('wA', curve(B_CALL, pk, [40, 700], [-220, -1000]));
    wirePath('wB', curve(B_SEND, MONITOR, [520, 260], [-760, 520]));
    wirePath('wC', curve(st.ep, B_BANNER, [-60, -900], [520, 200]));
    const z0 = 1;   // épaisseur recalculée plus bas avec le vrai zoom
    let wires = [];

    if (TT < 8.4){
      // 1. ouverture : l'appel arrive par le fil, personne ne décroche
      cam = st.cam;
      const b = lerp(.55, 1, easeOut(win(TT, 0, .45)));
      const red = win(TT, 4.6, 5.0);
      wires.push(['wA', 0, b, red > .5 ? '#ff6b78' : VIOLET, 1 - .6*red]);
    } else if (TT < 10.4){
      // 2. deux minutes plus tôt : on remonte le fil jusqu'à Julie, il s'efface derrière nous
      const k = smooth(win(TT, 8.5, 10.1)), b = 1 - k;
      const hp = pointAt('wA', b);
      const follow = {cx: hp[0], cy: hp[1] + 120, z: .42};
      cam = mixCam(mixCam(st.cam, follow, smooth(win(TT, 8.4, 8.9))), OFFICE_CAM, smooth(win(TT, 9.8, 10.4)));
      wires.push(['wA', 0, b, VIOLET, .8]);
      A('rewMini', {opacity: Math.min(win(TT, 8.4, 8.6), 1 - win(TT, 10.0, 10.3)).toFixed(2)});
      $('rewLabel').textContent = '2 MINUTES PLUS TÔT'; A('rewLabel', {fill:'#a5a8b8'}); A('rewRing', {stroke: VIOLET});
    } else if (TT < 22.4){
      // 3. Julie : bureau, puis son téléphone en grand
      cam = mixCam(OFFICE_CAM, PANEL_CAM, smooth(win(TT, 12.3, 13.1)));
      const t1 = TT - 12.6;
      const bump = (t, a, b, r = .35) => Math.min(smooth(win(t, a, a + r)), 1 - smooth(win(t, b - r, b)));
      cam = mixCam(cam, {cx:-159.2, cy:-1650, z:1.95}, bump(t1, 1.3, 2.75));
      cam = mixCam(cam, {cx:-159.2, cy:-1560, z:1.68}, bump(t1, 7.25, 9.75));
      if (t1 > 3.0) wires.push(['wA', 0, .32*easeOut(win(t1, 3.1, 4.0)), VIOLET, 1 - win(t1, 4.7, 5.2)]);
    } else if (TT < 24.2){
      // 4. la demande part : on suit le fil jusqu'au concurrent
      const k = smooth(win(TT, 22.5, 24.1));
      const hp = pointAt('wB', k);
      const follow = {cx: hp[0], cy: hp[1] + 100, z: .5};
      cam = mixCam(mixCam(PANEL_CAM, follow, smooth(win(TT, 22.4, 22.95))), DEPOT_CAM, smooth(win(TT, 23.55, 24.2)));
      wires.push(['wB', 0, k, VIOLET, 1]);
    } else if (TT < 26.0){
      // 5. chez le concurrent
      cam = {...DEPOT_CAM, z: DEPOT_CAM.z*(1 + .03*win(TT, 24.2, 26))};
      wires.push(['wB', 0, 1, VIOLET, 1]);
    } else if (TT < 32.0){
      // 6. on prend du recul : il rappelle, mais elle a déjà envoyé sa demande
      const out = smooth(win(TT, 26.0, 27.0)), back = smooth(win(TT, 28.2, 29.0));
      cam = mixCam(mixCam({...DEPOT_CAM, z: DEPOT_CAM.z*1.03}, MAP_CAM, out), PANEL_CAM, back);
      wires.push(['wB', 0, 1, VIOLET, 1]);
      wires.push(['wC', 0, easeInOut(win(TT, 27.0, 28.3)), VIOLET, 1 - win(TT, 31.0, 31.5)]);
    } else if (TT < 35.9){
      // 7-8. après le rembobinage : même escalier, même canapé
      cam = st.cam;
    } else {
      // 9. le site de Martin : la demande part… et la caméra la suit jusqu'à sa poche
      const t3 = TT - 35.9;
      wirePath('wA', curve(B_SEND_DOWN, pk, [40, 700], [-220, -1000]));
      const k = easeInOut(win(t3, 1.0, 2.6));
      const hp = pointAt('wA', k);
      const follow = {cx: hp[0], cy: hp[1] + 100, z: .45};
      cam = mixCam(mixCam(PANEL_CAM, follow, smooth(win(t3, .95, 1.45))), st.cam, smooth(win(t3, 2.15, 2.75)));
      wires.push(['wA', easeInOut(win(t3, 3.4, 4.2)), k, LIME, 1]);
    }

    A('world', {transform:`translate(540 860) scale(${cam.z.toFixed(4)}) translate(${(-cam.cx).toFixed(1)} ${(-cam.cy).toFixed(1)})`});
    wires.forEach(w => drawWire(w[0], w[1], w[2], w[3], w[4], cam.z));
    const S = w => [540 + (w[0]-cam.cx)*cam.z, 860 + (w[1]-cam.cy)*cam.z];
    stairsPills(st, S, cam.z);
  } else if (TT < 47.0){
    // 10. la nuit : les demandes arrivent toutes seules
    const t = TT - 41.3; A('S_night', {opacity:1}); renderNight(t);
    const hits = [.9, 2.3, 3.7], xs = [760, 420, 980];
    hits.forEach((h, i) => { if (t > h - .7 && t < h + .9)
      drawLine('lineA', `M${xs[i]} -60 C ${xs[i]} 420, 420 820, 70 1128`, easeOut(win(t, h + .05, h + .7)), easeOut(win(t, h - .6, h)), LIME); });
  } else if (TT < 54.6){
    A('S_offer', {opacity:1}); renderOffer(TT - 47.0);
  } else {
    const t = TT - 54.6; A('S_logo', {opacity:1}); renderLogo(t);
    drawLine('lineA', 'M540 -60 C 560 400, 980 700, 882 1076', 0, easeOut(win(t, .05, .62)), LIME, 1 - win(t, .75, 1.05));
  }
  let dip = 0; DIPS.forEach(d => dip = Math.max(dip, 1 - Math.abs(TT - d.c)/d.h));
  A('fade', {opacity: Math.max(clamp(dip, 0, 1), win(TT, DUR - .5, DUR)).toFixed(2)});
  renderSubs(TT);
  $('grain').style.backgroundPosition = `${(TT*997)%240}px ${(TT*631)%240}px`;
}

/* ============ CALAGE SUR LA VOIX ============ */
// [temps montage, temps réel] : chaque sous-titre démarre quand la phrase est dite
const ANCHORS = [[0.000,0.000],[2.300,2.300],[5.300,5.300],[8.500,8.487],[10.500,10.226],[12.100,11.706],[14.000,13.089],[15.600,14.769],[17.200,15.710],[18.500,16.475],[20.200,18.295],[23.900,20.511],[26.400,22.511],[29.000,24.591],[30.500,25.791],[32.100,27.091],[34.000,28.991],[36.000,30.978],[41.500,35.741],[44.200,38.101],[47.100,40.072],[49.900,42.872],[52.100,45.072],[58.600,51.572]];
const REAL_DUR = ANCHORS[ANCHORS.length - 1][1];
function designAt(r){
  for (let i = 0; i < ANCHORS.length - 1; i++){
    const [d0, r0] = ANCHORS[i], [d1, r1] = ANCHORS[i + 1];
    if (r <= r1) return d0 + (r - r0)*(d1 - d0)/(r1 - r0);
  }
  return DUR;
}

/* ============ LECTURE ============ */
const q = new URLSearchParams(location.search);
const STILL = q.get('t');
let t0 = performance.now(), paused = false, pauseAt = 0;
function loop(now){
  if (!paused){ const T = ((now - t0)/1000) % (REAL_DUR + 1); render(designAt(Math.min(T, REAL_DUR))); }
  requestAnimationFrame(loop);
}
if (STILL !== null){ render(+STILL); $('hint').remove(); }
else requestAnimationFrame(loop);
window.renderAt = r => render(designAt(r)); window.renderDesign = render; window.DUR = REAL_DUR;
stage.addEventListener('click', () => { paused = !paused; if (paused) pauseAt = performance.now(); else t0 += performance.now() - pauseAt; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r'){ t0 = performance.now(); paused = false; }
  if (k === 'arrowright') t0 -= 2000;
  if (k === 'arrowleft') t0 += 2000;
});
</script>
